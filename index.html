<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- WITHOUT THIS TAG A PHONE DOES NOT RENDER A PHONE LAYOUT.
     Mobile Safari lays an unmarked page out at 980px CSS pixels and then scales the whole
     thing down to fit, so every word and every button comes out about a third of its
     intended size. The app was never sized for a phone; it was a desktop page being
     shrunk. viewport-fit=cover lets the ivory run under the notch and the home bar, which
     is what the safe-area padding below is compensating for. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Added to the Home Screen this opens with no browser chrome — no address bar, no tabs.
     That is the difference between "a website the salon uses" and "the salon's app". -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Day">
<meta name="theme-color" content="#FBF8F5">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Artonus — My Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* House skin, unchanged from the fleet: the same ivory, espresso and gold, Cormorant for
     names and Lato for everything you have to read fast. Line-art icons only — no emoji in
     an Artonus UI, ever. */
  :root{
    --ivory:#FBF8F5; --card:#FFFDFB; --espresso:#2B0B00; --ink:#3B2A22; --muted:#8A7A6E;
    --gold:#B0894F; --gold-soft:#F3EADF; --line:#EADFD3;
    --ok:#3F7D5A; --ok-soft:#EEF6F0; --err:#A4392B; --err-soft:#FBEEEB; --err-line:#E8C9C2;
    --warn:#8A6D2F; --warn-soft:#FBF3E2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--ivory);color:var(--ink);
    font-family:Lato,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  /* min-height 100% + the ivory on html: without it a short screen (the code entry, an empty
     morning) leaves the page background showing below the content, which reads as a broken
     half-drawn page rather than an app. */
  html{min-height:100%;-webkit-text-size-adjust:100%}
  body{min-height:100vh;min-height:100dvh;
       padding:calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
               calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
       max-width:520px;margin:0 auto;
       /* A standalone app must not rubber-band like a web page. */
       overscroll-behavior-y:none}
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:var(--espresso);margin:0}
  .hdr{text-align:center;padding:18px 0 10px}
  .hdr img{height:26px;opacity:.92}
  .hdr h1{font-size:30px;margin-top:6px;letter-spacing:.2px}
  .hdr .sub{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:800}
  .anav{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:8px 13px;font-size:12.5px;font-weight:800;color:var(--espresso);cursor:pointer;position:relative}
  .pill svg{width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dot{position:absolute;top:-5px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--err);
    color:#fff;font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:11px}
  .card h3{font-size:21px}
  .lede,.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
  .in,.ta{width:100%;font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;background:var(--card);color:var(--ink);margin-bottom:9px}
  .ta{resize:vertical;min-height:78px}
  .in:focus,.ta:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;min-height:50px;border:none;border-radius:14px;background:var(--espresso);color:#FBF8F5;
    font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px}
  .btn:disabled{opacity:.5}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ghost{background:var(--card);border:1px solid var(--line);color:var(--espresso)}
  .skip{background:transparent;border:1px solid var(--line);color:var(--muted);min-height:44px;border-radius:12px;
    font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;padding:0 15px;
    display:inline-flex;align-items:center;justify-content:center;gap:7px}
  /* EVERY icon, sized and stroked, once. An SVG that misses its rule renders at the
     browser's default box with a filled path — which is how "Send" became a black blob. */
  /* EVERY inline icon has a size, whatever it sits in. An <svg> with a viewBox and no width
     expands to fill its container, so an icon dropped into a plain <div> renders the height
     of the card and shoves the text off the screen — which happened twice in one evening,
     once in the design-brief panel and once in the more-time note. The rules below are all
     more specific and still win; this is only the floor. */
  svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  button svg,.pill svg,.tag svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn svg{width:17px;height:17px}
  .sigbtn svg,.pill svg{stroke:var(--gold)}
  .sigbtn.sent svg,.hstate svg,.btn svg{stroke:currentColor}
  .helpbtn svg{width:18px;height:18px;stroke:var(--err)}
  .row2{display:flex;gap:8px;margin-top:8px}
  .lbl{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:900;color:var(--muted);margin:14px 0 6px}
  .sigrow{display:flex;flex-wrap:wrap;gap:7px}
  .sigbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;min-height:44px;padding:0 13px;font-family:inherit;font-size:13.5px;font-weight:800;
    color:var(--espresso);cursor:pointer}
  .sigbtn svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sigbtn:disabled{opacity:.55}
  .sigbtn.sent{background:var(--ok);border-color:var(--ok);color:#fff}
  .sigbtn.sent svg{stroke:#fff}
  /* A note is a record of today; a must-know is a lasting fact about her care. Two adjacent
     buttons that do different things must not look identical. */
  .sigbtn.mk{background:var(--gold-soft);border-color:#E7D6BE}
  /* A taken photo becomes the tile. Retake is the smaller, second tap — the common action
     once it is shot is looking at it, not replacing it. */
  .shot{display:flex;flex-direction:column;gap:4px}
  .shotbtn{width:100%;min-height:74px;border:1px solid var(--ok);border-radius:12px;cursor:pointer;
    background:var(--ok-soft) center/cover no-repeat;position:relative;overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center;padding:0}
  .shotbtn .cap{width:100%;background:linear-gradient(to top,rgba(43,11,0,.72),rgba(43,11,0,0));
    color:#fff;font-size:11px;font-weight:900;letter-spacing:.6px;padding:12px 0 4px}
  .retake{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;
    font-weight:800;cursor:pointer;padding:2px;text-decoration:underline}
  .rchip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px dashed var(--line);
    border-radius:999px;min-height:38px;padding:0 13px;font-family:inherit;font-size:13px;font-weight:800;
    color:var(--muted);cursor:pointer}
  .rchip.on{background:var(--espresso);border:1px solid var(--espresso);color:#FBF8F5}
  .rchip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .visit{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer}
  .visit .t{font-weight:900;font-size:13px;color:var(--espresso);min-width:62px}
  .visit .nm{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--espresso);line-height:1.15}
  .visit .sv{font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
    border-radius:999px;padding:3px 9px;margin-top:4px}
  .tag.book{background:var(--gold-soft);color:var(--warn)}
  .tag.serv{background:var(--ok-soft);color:var(--ok)}
  .tag.done{background:var(--line);color:var(--muted)}
  .tag.walk{background:var(--warn-soft);color:var(--warn)}
  .flag{background:var(--err-soft);border:1px solid var(--err-line);border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .flag .k{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:900;color:var(--err)}
  .note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;font-size:13.5px}
  .note .by{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0}
  .c{display:inline-block;background:var(--gold-soft);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--espresso)}
  .stars{color:var(--gold);letter-spacing:2px}
  /* THE ALERT — centred, everything behind it dimmed, and it stays until acknowledged. */
  .veil{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(43,11,0,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .veil.on{display:flex}
  .alert{background:var(--card);border-radius:18px;padding:18px 17px 16px;width:100%;max-width:340px;
    box-shadow:0 22px 60px rgba(43,11,0,.45);max-height:84vh;overflow:auto}
  .alert .hd{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
    font-weight:900;color:var(--gold);margin-bottom:10px}
  .alert .hd svg{width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:2}
  .alert .item{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px;line-height:1.5}
  .alert .item:first-of-type{border-top:none;padding-top:2px}
  .alert .item .who{font-size:11px;color:var(--muted);margin-top:2px}
  .alert .item.fresh{background:var(--gold-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
  .alert .newline{font-size:11.5px;color:var(--gold);font-weight:800;margin-top:8px}
  .ba .was{color:var(--muted);text-decoration:line-through}
  .ba .arrow{color:var(--gold);font-weight:900}
  /* Help: her own dock, always reachable, never mixed with routine signals. */
  .dock{position:sticky;bottom:0;margin:16px -16px 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--ivory) 74%,rgba(251,248,245,0));z-index:40}
  .helpbtn{width:100%;border:1.5px solid var(--err-line);background:var(--err-soft);color:var(--err);
    border-radius:14px;min-height:52px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .helpbtn svg{width:18px;height:18px;fill:none;stroke:var(--err);stroke-width:2.2;stroke-linecap:round}
  .hstate{border-radius:14px;padding:11px 13px;font-size:13px}
  .hstate.wait{background:var(--err);color:#fff}
  .hstate.coming{background:var(--ok);color:#fff}
  .hstate .r{display:flex;align-items:center;gap:8px}
  .hstate .r b{font-size:14px}
  .hstate .t2{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:900}
  .hstate svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
  .hstate button{width:100%;margin-top:8px;border:none;border-radius:10px;min-height:38px;font-family:inherit;
    font-size:12.5px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.92);color:var(--err)}
  .hstate.coming button{color:var(--ok)}
  .hstate .cr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .hstate .cr button{width:auto;margin:0;background:rgba(255,255,255,.16);color:#fff;
    border:1px solid rgba(255,255,255,.35);border-radius:16px;min-height:32px;padding:0 11px;font-size:11.5px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));
    background:var(--espresso);color:#FBF8F5;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:700;
    z-index:200;display:none;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(43,11,0,.35)}
  .toast.on{display:block}
  .toast.err{background:var(--err)}
  .quiet{color:var(--muted)}
  .mtnum::-webkit-outer-spin-button,.mtnum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #offline{position:fixed;left:0;right:0;top:0;z-index:99;background:#8a1c1c;color:#fff;
    font-size:12.5px;font-weight:800;text-align:center;
    padding:calc(7px + env(safe-area-inset-top)) 12px 7px}
  /* The boot skeleton. Deliberately the SHAPE of the day list she is about to see, not a
     spinner — a spinner says "wait", a skeleton says "it is coming, and here is where". */
  .bootskel{padding-top:6px}
  .bootskel .hdr{display:flex;flex-direction:column;align-items:center;gap:10px}
  .bootskel .skel{height:13px;border-radius:7px;margin:7px 0;
    background:linear-gradient(90deg,rgba(43,11,0,.055) 25%,rgba(43,11,0,.11) 37%,rgba(43,11,0,.055) 63%);
    background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite}
  .bootskel .skel-logo{width:30px;height:30px;border-radius:9px;margin:14px 0 0}
  .bootskel .skel-title{width:132px;height:26px;border-radius:8px}
  .bootskel .skel-btn{height:48px;border-radius:14px;margin-top:16px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  @media(prefers-reduced-motion:reduce){.bootskel .skel{animation:none}}
  /* The searchable pickers — the service list and the add-on list. Rows, not a <select>:
     a native select on a phone hides the price, and the price is the point. */
  .picklist{max-height:46vh;overflow-y:auto;margin-top:10px}
  .pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
    text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
    min-height:52px;padding:9px 13px;margin-bottom:7px;font-family:inherit;font-size:14.5px;
    font-weight:800;color:var(--ink);cursor:pointer}
  .pick:disabled{opacity:.55}
  .pick .quiet{font-weight:700;font-size:12.5px;color:var(--muted)}
  /* The salon's own mark in the alert header, not a stock bell. A technician sees this a
     dozen times a day; it should look like it belongs to Artonus. */
  .alert .hd .hdmark{height:16px;width:auto;margin-right:8px;vertical-align:-3px;opacity:.95}
  /* The running list of what this chair has already told the desk. */
  .sentbar{display:flex;gap:9px;align-items:flex-start;background:var(--ok-soft);
    border:1px solid var(--ok);border-radius:12px;padding:10px 12px;margin:0 0 10px;
    font-size:13.5px;line-height:1.45}
  /* WIDTH AND HEIGHT ARE NOT OPTIONAL. An inline SVG with a viewBox and no explicit size
     expands to fill its box — the design-brief star rendered the height of the card and shoved
     the text off the screen. flex:none stops it being squashed; it does not give it a size. */
  .sentbar svg{flex:none;stroke:var(--ok);margin-top:2px;width:16px;height:16px}
  .sigbtn.sent{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .sigbtn.sent svg{stroke:var(--ok)}
  .sigbtn:disabled{opacity:1;cursor:default}
  /* The design brief — gold, above everything, because it is the thing she is about to do. */
  .brief{display:flex;gap:9px;align-items:flex-start;background:var(--gold-soft);
    border:1px solid var(--gold);border-radius:14px;padding:12px 13px;margin-bottom:9px;
    font-size:14px;line-height:1.5}
  .brief svg{flex:none;stroke:var(--gold);margin-top:2px;width:16px;height:16px}
  .tag.want{background:var(--gold-soft);border-color:var(--gold);color:var(--espresso)}
  .tag.want svg{width:11px;height:11px;stroke:var(--gold);vertical-align:-1px;margin-right:3px}
  /* Moves and cancellations — the day rearranging itself, said out loud. */
  .changes{margin-bottom:10px}
  .chg{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft,#FBF3E2);
    border:1px solid var(--warn,#8A6D2F);border-radius:12px;padding:9px 12px;margin-bottom:6px;
    font-size:13.5px;line-height:1.45}
  .chg svg{flex:none;stroke:var(--warn,#8A6D2F);margin-top:2px;width:16px;height:16px}
  .chg .was{text-decoration:line-through;color:var(--muted);margin-right:4px}
  .chg .arrow{color:var(--muted);margin-right:4px}
</style>
</head>
<body>
<div id="offline" style="display:none">Not reaching the front desk — what you see may be out of date.</div>
<!-- THE FIRST PAINT, before a byte of JS runs.
     A call to Apps Script costs about a second no matter what it does, and until now that
     second was a blank ivory screen: nothing to say the app had started, nothing to say it
     was working. A technician taps the icon, sees nothing, and taps again. -->
<div id="app"><div class="bootskel" aria-hidden="true">
  <div class="hdr"><div class="skel skel-logo"></div><div class="skel skel-title"></div></div>
  <div class="card">
    <div class="skel" style="width:52%;height:17px;margin-bottom:14px"></div>
    <div class="skel" style="width:100%"></div>
    <div class="skel" style="width:88%"></div>
    <div class="skel skel-btn"></div>
  </div>
  <div class="card">
    <div class="skel" style="width:40%;height:17px;margin-bottom:14px"></div>
    <div class="skel" style="width:94%"></div>
    <div class="skel" style="width:70%"></div>
  </div>
</div></div>
<div class="veil" id="veil"></div>
<!-- SEPARATE FROM #veil ON PURPOSE. The alert repaints on every poll; the composer lives in
     #veil and must not be torn down by it. Sharing one element meant paintAlert() closed the
     must-know box every few seconds and it could not be filled in at all. -->
<div class="veil" id="alertveil"></div>
<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════════
   THE CHAIR — the technician's phone.
   Everything here is a thin caller of Clients' write API. This file owns no data and
   decides no permissions: every door it knocks on re-checks the device token, and her
   chair-scoping is enforced there, not here.
   ══════════════════════════════════════════════════════════════════════════════ */
'use strict';

var ICON = {
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  /* Used by the cancellation line. Referencing an icon that does not exist prints the word
     "undefined" into the page, which is how a missing icon becomes a visible bug. */
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  bell: '<svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9z"/><path d="M10.5 18a1.8 1.8 0 0 0 3 0"/></svg>',
  hand: '<svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M8.5 7.5v5"/><path d="M15.5 7.5v5"/><path d="M5 12v3a7 7 0 0 0 14 0v-3"/></svg>',
  person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.8l5.9-.9z"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>',
  cam:  '<svg viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg>'
};

/* ══════════════════════ THE ONLY LINK TO GOOGLE ══════════════════════
 * This page is served from GitHub Pages, not from Google. That is the entire point: every
 * failure this app had on a phone — Drive's "unable to open the file", /u/N account routing,
 * an iframe nothing could reach into — came from asking a phone to LOAD a google.com page.
 * It does not any more. It loads from our own domain and calls one JSON endpoint.
 *
 * Content-Type is text/plain on purpose. application/json triggers a CORS preflight, Apps
 * Script cannot answer an OPTIONS request, and the browser gives up before the POST is sent.
 * A "simple request" goes straight through. Measured 2026-08-09.
 */
var BOOK = 'https://script.google.com/macros/s/AKfycby0SWGq-PC702gm02TV8mzrOw36wV1jL6P4XlJxpfAvLYs_bzDJ03qGYzrcD74vwX80/exec';

function api(name, payload){
  return fetch(BOOK, {
    method: 'POST',
    redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ name: name, payload: payload || {} })
  }).then(function(r){
    return r.text();
  }).then(function(t){
    var out;
    /* Apps Script answers an unauthenticated or broken call with an HTML page, not JSON.
       Parsing that as data is how a dead endpoint looks like a mysterious app bug. */
    try { out = JSON.parse(t); }
    catch (e) { throw new Error('The book could not be reached. Tell the front desk.'); }
    if (out.error) throw new Error(out.error);
    return out;
  })['catch'](function(e){
    if (e && e.message) throw e;
    throw new Error('No connection. Check the wifi and try again.');
  });
}

/* The token lives on the phone and nowhere else. localStorage rather than a cookie: it is

function loadDay(){
  var s = ++S.session;

     feed in the same breath costs nothing extra and saves a whole round trip on open. */
  api('techPoll', { token:S.token, since:S.cursor }).then(function(r){
    if (S.session !== s) return;
    REFRESHING = false; pollTrouble(false);
    S.tech=r.tech; S.chair=r.chair; S.visits=r.visits; S.help=r.help; S.caps=r.caps||[];
    if (r.vocab && r.vocab.length) S.vocab = r.vocab;
    S.changes = r.changes || [];
    /* quiet: whatever happened before she opened the app is history. It is all in the bell,
       and the count is on the badge; what it must not be is a modal over her first screen. */
    absorb(r, true);
    S.view='today'; render(); paintAlert(); refreshBell();
    poll();
  })['catch'](function(e){
    /* A dead token is the ordinary end of a device's life, not an error to shout about. */
    if (/not signed in/.test(e.message)){ dropToken(); S.token=''; S.view='enrol'; render(); return; }
    $('app').innerHTML = head('Your day')
      + '<div class="card"><h3>Could not load your day</h3><p class="lede">'+esc(e.message)+'</p>'

/* WHAT WE KNOW ABOUT HER. She reads all of it — a technician who cannot see the allergy is

     not — a technician who dismissed the pop-up mid-service had no second way to read it.

      + '</div><b style="font-size:19px">'+c.tally.avg+'</b> '
      + '<span class="quiet">· '+c.tally.n+' visits, past year</span></div>';

          + (n.text?esc(n.text):'')+'</div>'; }).join('')

/* THE THREE PHOTOS THAT ARE NOT OPTIONAL. Before proves what she walked in with; After and
   Color are what the next technician needs when she comes back in five weeks. */
var REQ = ['Before','After','Color'];

/* What is still outstanding before this visit can be closed. Mirrors finishBlockers_ on the
   server word for word — the browser is a courtesy, the server is the rule. */
function missingBits(v){
  var got = (S.card && S.card.photos) || {}, out = [];
  if (!got.Before) out.push('the before photo');
  if (!got.After)  out.push('the after photo');
  if (!(S.card && S.card.color)) out.push('the color she had');
  return out;
}

/**
 * WHAT THE DESK ALREADY HAS.
 *
 * The demo's answer to a problem a stamped tick solves badly: one bar at the top of the
 * chair card listing everything already sent for this visit. She sees at a glance that her
 * +15 went, so she does not send it twice — and the desk does not get a second request it
 * has to work out the meaning of.
 */
function sentBar(v){
  var s = [];
  if (v.moreTime) s.push('+' + v.moreTime + ' min');
  (v.addons || []).forEach(function(a){ s.push((a && (a.label || a.name)) || ''); });
  if (v.tier) s.push(v.tier);
  (v.campaigns || []).forEach(function(c){ s.push(c); });
  if (v.almost) s.push('almost done');
  s = s.filter(Boolean);
  if (!s.length) return '';
  return '<div class="sentbar">'+ICON.check
    + '<div><b>Sent to the front desk</b><br><span class="quiet">'
    + s.map(esc).join(' · ')+'</span></div></div>';
}

function openSvc(){
  $('veil').className = 'veil on';
  $('veil').innerHTML = '<div class="alert"><h3>Change the service</h3>'
    + '<input class="in" id="svcq" placeholder="Start typing&hellip;" autocomplete="off">'
    + '<div id="svclist" class="picklist"><p class="lede">Loading the menu&hellip;</p></div>'
    + '<button class="skip" onclick="shutVeil()" style="margin-top:8px">Cancel</button></div>';
  withMenu(function(m){
    function paint(){
      var q = ($('svcq').value||'').trim().toLowerCase();
      var hits = m.services.filter(function(s){
        return !q || s.name.toLowerCase().indexOf(q) >= 0 || s.group.toLowerCase().indexOf(q) >= 0;
      }).slice(0, 40);
      $('svclist').innerHTML = hits.length
        ? hits.map(function(s){
            return '<button class="pick" data-svc="'+esc(s.name)+'">'
              + '<b>'+esc(s.name)+'</b><span class="quiet">'+esc(s.group)+' · '+money(s.price)+'</span></button>';
          }).join('')
        : '<p class="lede">Nothing matches. Ask the front desk.</p>';
      Array.prototype.forEach.call($('svclist').querySelectorAll('[data-svc]'), function(b){
        b.onclick = function(){
          var to = b.getAttribute('data-svc');
          b.disabled = true; b.textContent = 'Sending…';
          api('signal', { token:S.token, key:S.key, kind:'SVC_CHANGE', payload:{ to:to } })
            .then(function(){ shutVeil(); toast('The desk has it — '+to); refresh(true); })
            ['catch'](function(e){ toast(e.message,'err'); paint(); });
        };
      });
    }
    $('svcq').oninput = paint; paint(); $('svcq').focus();
  });
}
function openAddon(){
  $('veil').className = 'veil on';
  $('veil').innerHTML = '<div class="alert"><h3>Add an add-on</h3>'
    + '<div id="addlist"><p class="lede">Loading&hellip;</p></div>'
    + '<button class="skip" onclick="shutVeil()" style="margin-top:8px">Cancel</button></div>';
  withMenu(function(m){
    /* Only this chair's family. All seven used to be offered everywhere, told apart by
       "(pedicure)" in the label — so a manicure chair was shown Gel and Removal, which mean
       something else there, and the parenthetical rode along onto the desk's ticket. */
    var fam = /pedicure/i.test(String((S.visit && S.visit.svc) || '')) ? 'pedicure' : 'manicure';
    var list = (m.addons||[]).filter(function(a){ return !a.family || a.family === fam; });
    $('addlist').innerHTML = '<p class="lede" style="margin:0 0 6px">For a <b>'+fam+'</b>.</p>'
      + list.map(function(a){
      return '<div class="row2" style="margin-top:8px">'
        + '<button class="pick" data-add="'+esc(a.name)+'" style="flex:1"><b>'+esc(a.label)+'</b>'
        + '<span class="quiet">'+(a.price?money(a.price)+(a.per?' per '+a.per:''):'no extra charge')+'</span></button>'
        + (a.per ? '<input class="in" style="width:74px;margin:0" type="text" inputmode="numeric" '
                 + 'pattern="[0-9]*" value="1" id="q_'+esc(a.name).replace(/\W/g,'')+'">' : '')
        + '</div>';
    }).join('');
    Array.prototype.forEach.call($('addlist').querySelectorAll('[data-add]'), function(b){
      b.onclick = function(){
        var name = b.getAttribute('data-add');
        var qf = $('q_'+name.replace(/\W/g,''));
        b.disabled = true;
        api('signal', { token:S.token, key:S.key, kind:'ADDON',
                        payload:{ name:name, qty: qf ? Number(qf.value)||1 : 1 } })
          .then(function(){ shutVeil(); toast('Added — the desk has it'); refresh(true); })
          ['catch'](function(e){ b.disabled=false; toast(e.message,'err'); });
      };
    });
  });
}
function photosHtml(){
  var got = (S.card && S.card.photos) || {}, thumb = S.thumbs || {};
  return '<div class="lbl">Photos of this visit — required</div><div class="sigrow">'
    + REQ.map(function(l){
        var has = !!got[l], src = thumb[l];
        /* Once it is taken the slot becomes the picture itself, and tapping opens it full
           size. Retaking is deliberately a second, smaller tap — the common action here is
           looking, not replacing. */
        if (has) return '<div class="shot" style="flex:1">'
          + '<button class="shotbtn" data-open="'+l+'"'
          + (src?' style="background-image:url('+src+')"':'')+'>'
          + (src?'':ICON.cam)+'<span class="cap">'+l+'</span></button>'
          + '<button class="retake" data-photo="'+l+'">Retake</button></div>';
        return '<button class="sigbtn" data-photo="'+l+'" '
          + 'style="flex:1;flex-direction:column;min-height:74px;gap:3px;'
          + 'background:var(--err-soft);border-color:var(--err-line);color:var(--err)">'
          + ICON.cam+'<span>'+l+'</span>'
          + '<span style="font-size:9.5px;letter-spacing:1px;font-weight:900;opacity:.8">REQUIRED</span></button>';
      }).join('')
    + '</div>';
}

/* One round trip for all three thumbnails when the card opens. Drive's own small rendition
   is a few kilobytes, so this costs less than the card itself. */
function loadThumbs(){
  if (!S.key || !S.card || !Object.keys(S.card.photos||{}).length) return;
  var s = ++S.session, key = S.key;
  api('techPhotos', { token:S.token, key:key }).then(function(r){
    if (S.session !== s || S.key !== key) return;
    S.thumbs = r.photos || {}; render();
  })['catch'](function(){});
}

    + 'box-shadow:none;padding:0;text-align:center">'

      ? '<img src="'+src+'" alt="'+esc(label)+'" style="max-width:100%;max-height:70vh;'
        + 'border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5)">'
      : '<p class="lede" style="color:#fff">That photo could not be opened.</p>';

}
function wirePhotos(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-photo]'), function(b){
    b.onclick = function(){ takePhoto(b.getAttribute('data-photo')); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function(b){
    b.onclick = function(){ openShot(b.getAttribute('data-open')); };
  });
}
function takePhoto(label){
  var i = document.createElement('input');
  /* NO `capture` attribute. Setting capture='environment' forces the camera and hides the
     photo library entirely — on iOS the picker opens straight into the lens with no way out.
     Without it the OS offers the choice: Photo Library, Take Photo, Choose File. Taking the
     photo is still what we want her to do; blocking every other route was never the point. */
  i.type='file'; i.accept='image/*';
  i.onchange = function(){
    var f = i.files && i.files[0]; if (!f) return;
    toast('Saving the '+label.toLowerCase()+' photo…');
    shrink(f, function(dataUrl){
      api('techPhoto', { token:S.token, key:S.key, label:label, data:dataUrl }).then(function(r){
        if (S.card) S.card.photos = r.photos;
        toast(ICON.check+' '+label+' saved.'); render(); loadThumbs();
      })['catch'](function(e){ toast(e.message,'err'); });
    });
  };
  i.click();
}
/* DOWNSCALED IN THE BROWSER, ALWAYS — but this is the salon's color record, so the
   settings are chosen for that and not just for the wire.

   1600px on the long edge at quality 0.88. A 12MP phone photo is 3–6MB and would not fit
   through Apps Script at all; 1200/0.82 fit comfortably but lost the free-edge line and put
   visible blocking into saturated reds and chrome, which are precisely the colors anyone
   opens these photos to check. 1600/0.88 is roughly double the bytes — a few hundred KB —
   and holds glitter and chrome texture. Well inside the 3MB the server accepts.

   TWO THINGS THAT ARE EASY TO GET WRONG AND VERY VISIBLE:
   · ORIENTATION. A phone camera writes the rotation into EXIF rather than into the pixels.
     Drawing straight to a canvas throws that away, and every portrait photo lands sideways.
     createImageBitmap with imageOrientation:'from-image' applies it; the <img> fallback is
     for browsers that lack it, where the tag is honoured anyway.
   · SMOOTHING. Reducing 4032px to 1600px in one step aliases badly on fine detail — the
     exact texture we are keeping the photo for. imageSmoothingQuality:'high' costs nothing. */
var PHOTO_MAX = 1600, PHOTO_Q = 0.88;

function shrink(file, done){
  function paint(bmp, w0, h0){
    var w = w0, h = h0;
    if (w > h && w > PHOTO_MAX){ h = Math.round(h * PHOTO_MAX / w); w = PHOTO_MAX; }
    else if (h >= w && h > PHOTO_MAX){ w = Math.round(w * PHOTO_MAX / h); h = PHOTO_MAX; }
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, 0, 0, w, h);
    done(cv.toDataURL('image/jpeg', PHOTO_Q));
  }
  if (window.createImageBitmap){
    createImageBitmap(file, { imageOrientation: 'from-image' })
      .then(function(b){ paint(b, b.width, b.height); })
      ['catch'](function(){ viaImg(file, paint); });
    return;
  }
  viaImg(file, paint);
}
function viaImg(file, paint){
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){ paint(img, img.naturalWidth, img.naturalHeight); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ── the composers. Same vocabulary the desk taps, so one visit reads the same whoever
      wrote it down. Care and Manner stay on her card; the rest belong to today. ── */
var VOCAB = [
  /* THE SALON'S OWN WORDS, copied from the desk's CHIPS list, which Trung corrected on
     2026-08-02. The phone had shipped with a generic nail-industry list instead — Squoval,
     Dip, Acrylic, Milky, "Brings her mum" — words Artonus does not use and a technician
     would type around, which is how a book fills up with free text. This is only the list a
     phone shows before its first answer arrives; the live vocabulary rides every poll. */
  { group:'Shape',  items:['Coffin','Almond','Square','Round','Stiletto','Oval'] },
  { group:'Length', items:['Short','Medium','Long'] },
  { group:'System', items:['Signature','Structure','Gel-X','Builder gel','Classic gel','Regular polish'] },
  { group:'Color',  items:['Nudes','Reds','Pinks','Darks','Brights','French','Chrome','Glitter'] },
  { group:'Care',   items:['Light pressure','Sensitive skin','Thin nails','Bites nails','Needs a cushion'], standing:true },
  { group:'Manner', items:['Prefers quiet','Chatty','Runs late','Books ahead','Brings kids'], standing:true }
];

/* THE SALON'S OWN WORDS WIN. The list above is only what a phone shows before its first
   answer arrives — every poll carries the vocabulary the owner actually keeps in Settings,
   so a word he retires disappears from the chair and a word he adds turns up there. The
   chair used to be frozen to the list above, which is why it kept offering words that had
   been corrected weeks earlier. */
function vocabGroups(){
  return (S.vocab && S.vocab.length) ? S.vocab : VOCAB;
}
var COMP = { kind:'note', picked:{} };
function openCompose(kind){
  COMP = { kind:kind, picked:{} };
  var mk = kind==='mk';
  var all = vocabGroups();
  var groups = mk ? all.filter(function(g){ return g.standing; }) : all;
  $('veil').className = 'veil on';
  $('veil').innerHTML = '<div class="alert"><h3>'+(mk?'Add a must-know':'Write a note')+'</h3>'
    + '<p class="lede">'+(mk?'A lasting fact about her care. Everyone sees it on her card, every visit.'
        :'What happened today. Care and Manner words stay on her card.')+'</p>'
    + '<div id="cgrid">'+groups.map(function(g){
        return '<div class="lbl">'+esc(g.group)+(g.standing?' · stays on her card':'')+'</div>'
          + '<div class="sigrow">'+g.items.map(function(t){
              return '<button class="rchip" data-chip="'+esc(t)+'">'+esc(t)+'</button>'; }).join('')+'</div>';
      }).join('')+'</div>'
    + (mk ? '<div class="lbl">What kind of thing is it?</div><div class="sigrow" id="cclass">'
        + [['allergy','Allergy or reaction'],['care','How to treat her'],['other','Something else']]
            .map(function(c, i){
              return '<button class="rchip'+(i===0?' on':'')+'" data-cls="'+c[0]+'">'+esc(c[1])+'</button>';
            }).join('')
        + '</div><p class="hint" style="margin:-4px 0 8px">An allergy is shown in red at the top of '
        + 'her card, to everyone, every visit.</p>' : '')
    + '<div class="lbl">'+(mk?'In your words — required':'Anything else')+'</div>'
    + '<textarea class="ta" id="ctext" rows="3" placeholder="'
    + (mk?'e.g. Reacts to acetone — use the gentle remover':'What she asked for, what worked…')+'"></textarea>'
    + '<p class="hint" style="margin:-4px 0 8px">No phone numbers or emails.</p>'
    + '<div class="row2"><button class="skip" style="flex:1" onclick="shutVeil()">Cancel</button>'
    + '<button class="btn" id="csave" style="flex:1" disabled>'+(mk?'Save must-know':'Save note')+'</button></div></div>';
  Array.prototype.forEach.call(document.querySelectorAll('[data-chip]'), function(b){
    b.onclick = function(){
      var t = b.getAttribute('data-chip');
      if (COMP.picked[t]) delete COMP.picked[t]; else COMP.picked[t] = true;
      b.className = 'rchip' + (COMP.picked[t] ? ' on' : '');
      syncCompose();
    };
  });
  /* The class chips are single-choice — a thing is an allergy or it is not. */
  if ($('cclass')){
    COMP.cls = 'allergy';
    Array.prototype.forEach.call($('cclass').querySelectorAll('[data-cls]'), function(b){
      b.onclick = function(){
        COMP.cls = b.getAttribute('data-cls');
        Array.prototype.forEach.call($('cclass').querySelectorAll('[data-cls]'), function(o){
          o.className = 'rchip' + (o === b ? ' on' : '');
        });
      };
    });
  }
  $('ctext').oninput = syncCompose;
  $('csave').onclick = saveCompose;
  syncCompose();
}
function syncCompose(){
  var txt = ($('ctext')||{value:''}).value.trim();
  var n = Object.keys(COMP.picked).length;
  /* A must-know with no words is a chip nobody can act on. A note can be chips alone. */
  $('csave').disabled = COMP.kind==='mk' ? !txt : !(n || txt);
}
function saveCompose(){
  var b = $('csave'); b.disabled = true; b.innerHTML = 'Saving…';
  var txt = ($('ctext')||{value:''}).value, chips = Object.keys(COMP.picked);
  var mk = COMP.kind==='mk';
  api(mk?'techMustKnow':'techNote',
      { token:S.token, key:S.key, chips:chips, text:txt,
        /* cls was never sent, so a technician could not raise an allergy — every must-know
           she wrote arrived as "other" and never showed in red at the top of the card. */
        cls: mk ? (COMP.cls || 'other') : '',
        opId: (mk?'mk-':'nt-') + S.key + '-' + Date.now() }).then(function(){
    shutVeil(); toast(ICON.check+' Saved to her card.');
    return api('techClient', { token:S.token, key:S.key });
  }).then(function(c){ if (c) S.card = c; render(); })
  ['catch'](function(e){ b.disabled=false; b.innerHTML = mk?'Save must-know':'Save note'; toast(e.message,'err'); });
}

/* ── THE RATING — of the VISIT, never of the woman ──────────────────────────
 *
 * The demo's governing line is "Rate this visit — never the person," and the build had
 * replaced it with "Only the team ever sees this. She never does." That is not the same
 * promise; it is permission. The reasons had drifted with it: 'Hard to work with' and
 * 'Changed her mind' judge a person, and they are written to a spreadsheet row keyed to a
 * named woman's phone number, where they outlive everyone's memory of the day.
 *
 * These reasons describe what HAPPENED, which is the only thing the next technician can act
 * on. And the booking chips below are the point of the whole screen: a star with no
 * instruction is a grudge, a star with "book extra time" is a salon that runs better.
 */
var WHY = ['Ran past booked time', 'Changed design mid-service', 'Asked for redo',
           'Arrived late', 'Damage to repair'];
var WRAP = [['Book as usual', 'check'], ['Book extra time', 'clock'],
            ['Check with her before booking', 'hand']];

function openRating(){
  var stars = 0, why = {}, wrap = {};

  function hint(){
    if (!stars) return 'Rate this visit — never the person.';
    return stars >= 4 ? 'Good visit — pick the booking note and save.'
                      : 'Say what happened, so the next person can act on it.';
  }
  function ready(){
    var needWhy = stars > 0 && stars <= 3;
    var told = Object.keys(wrap).length || (($('rnote') || { value: '' }).value.trim().length > 0);
    return stars > 0 && told && (!needWhy || Object.keys(why).length > 0);
  }

  function paint(){
    $('veil').innerHTML = '<div class="alert"><h3>How was the visit?</h3>'
      + '<div class="sigrow" style="justify-content:center;margin:8px 0 2px">'
      + [1,2,3,4,5].map(function(n){
          return '<button class="rchip'+(n<=stars?' on':'')+'" data-star="'+n+'" '
            + 'style="min-width:52px;min-height:52px;justify-content:center;font-size:20px">'
            + (n<=stars?'★':'☆')+'</button>'; }).join('')+'</div>'
      + '<p class="hint" style="text-align:center;margin:0 0 10px">'+esc(hint())+'</p>'
      + (stars && stars<=3
          ? '<div class="lbl">What made it that way? — pick at least one</div><div class="sigrow">'
            + WHY.map(function(w){ return '<button class="rchip'+(why[w]?' on':'')+'" data-why="'+esc(w)+'">'
                + esc(w)+'</button>'; }).join('')+'</div>' : '')
      + '<div class="lbl">For the front desk — pick all that apply</div><div class="sigrow">'
      + WRAP.map(function(w){ return '<button class="rchip'+(wrap[w[0]]?' on':'')+'" data-wrap="'+esc(w[0])+'">'
          + (ICON[w[1]]||'')+esc(w[0])+'</button>'; }).join('')+'</div>'
      + '<div class="lbl">Your booking tip — optional</div>'
      + '<textarea class="ta" id="rnote" rows="2" placeholder="e.g. Book her with Chelsea next time."></textarea>'
      + '<div class="row2"><button class="skip" style="flex:1" onclick="shutVeil()">Not now</button>'
      + '<button class="btn" id="rsave" style="flex:1"'+(ready()?'':' disabled')+'>Save rating</button></div></div>';

    Array.prototype.forEach.call(document.querySelectorAll('[data-star]'), function(b){
      b.onclick = function(){ stars = Number(b.getAttribute('data-star')); why = {}; paint(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-why]'), function(b){
      b.onclick = function(){ var w=b.getAttribute('data-why');
        if (why[w]) delete why[w]; else why[w]=true; paint(); };
    });
    /* "Book as usual" is exclusive: it cannot be true at the same time as "book extra time"
       or "check with her first", and a desk reading both would not know which to believe. */
    Array.prototype.forEach.call(document.querySelectorAll('[data-wrap]'), function(b){
      b.onclick = function(){
        var w = b.getAttribute('data-wrap');
        if (wrap[w]) { delete wrap[w]; }
        else if (w === 'Book as usual') { wrap = {}; wrap[w] = true; }
        else { delete wrap['Book as usual']; wrap[w] = true; }
        paint();
      };
    });
    if ($('rnote')) $('rnote').oninput = function(){
      var b = $('rsave'); if (b) b.disabled = !ready();
    };
    if ($('rsave')) $('rsave').onclick = function(){
      var btn=$('rsave'); btn.disabled=true; btn.innerHTML='Saving…';
      /* The booking instruction rides with the reasons — it is the half the desk acts on. */
      var chips = Object.keys(why).concat(Object.keys(wrap));
      api('techRating', { token:S.token, key:S.key, stars:stars,
                          why:chips, note:($('rnote')||{value:''}).value }).then(function(){
        shutVeil(); toast(ICON.check+' Saved. Thank you.');
        /* Re-pull the card, not just the day: without this her own rating is invisible until
           she leaves the screen and comes back, which reads as "it did not save". */
        api('techClient', { token:S.token, key:S.key }).then(function(c){ S.card = c; render(); })
          ['catch'](function(){ refresh(); });
      })['catch'](function(e){ btn.disabled=false; btn.innerHTML='Save rating'; toast(e.message,'err'); });
    };
  }
  $('veil').className='veil on';
  paint();
}

function wireChair(v){
  Array.prototype.forEach.call(document.querySelectorAll('[data-mt]'), function(b){
    b.onclick = function(){ sig('MORE_TIME', { mins:Number(b.getAttribute('data-mt')) }, b); };
  });
  function sendTyped(){
    var n = Number(($('mtnum').value||'').replace(/\D/g,''));
    if (!(n>=5 && n<=120)){ toast('Between 5 and 120 minutes.','err'); return; }
    sig('MORE_TIME', { mins:n }, $('mtgo'));
  }
  if ($('mtgo')) $('mtgo').onclick = sendTyped;
  /* Enter sends. She has one dry hand and the button is the width of a thumb away. */
  if ($('mtnum')) $('mtnum').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); sendTyped(); } };
  Array.prototype.forEach.call(document.querySelectorAll('[data-sig]'), function(b){
    b.onclick = function(){ sig(b.getAttribute('data-sig'), {}, b); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-camp]'), function(b){
    b.onclick = function(){ sig('CAMPAIGN_INTEREST', { name:b.getAttribute('data-camp') }, b); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'), function(b){
    b.onclick = function(){ sig('TIER_CHANGE', { to:b.getAttribute('data-tier') }, b); };
  });
  if ($('finish')) $('finish').onclick = function(){ sig('FINISHED', {}, $('finish')); };
  wirePhotos();
}

/* One lock across the whole round trip. Without it a second tap while the first is in the
   air sends the same thing twice, and the desk sees a request nobody made. */
function sig(kind, payload, btn){
  if (S.busy) return;
  S.busy = true;
  var el = (typeof btn === 'string') ? $(btn) : btn;
  var was = el && el.innerHTML;
  if (el){ el.disabled = true; el.innerHTML = 'Sending…'; }
  api('signal', { token:S.token, key:S.key, kind:kind, payload:payload }).then(function(){
    S.busy = false;
    if (el){ el.className = (el.className||'').replace(' sent','') + ' sent';
             el.innerHTML = ICON.check + ' Sent'; }
    toast(ICON.check+' The front desk has it.');
    refresh();
    if (S.key && S.visit && !S.visit.nameOnly)
      api('techClient', { token:S.token, key:S.key }).then(function(c){ S.card = c; render(); })['catch'](function(){});
  })['catch'](function(e){
    S.busy = false;
    if (el){ el.disabled=false; el.innerHTML = was; }
    toast(e.message,'err');
  });
}

/* ─────────────────────────── help ─────────────────────────── */
function mmss(ms){ var s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
function stampMs(s){ var t = Date.parse(String(s||'').replace(' ','T')); return isFinite(t)?t:Date.now(); }

function dockHtml(){
  if (!can('tech.help')) return '';
  var h = S.help;
  if (!h) return '<div class="dock"><button class="helpbtn" onclick="askHelp()">'
    + ICON.hand+'Ask the front desk for help</button></div>';
  if (h.ack)
    return '<div class="dock"><div class="hstate coming"><div class="r">'+ICON.check
      + '<b>'+esc(h.ack.by)+' is coming</b><span class="t2">'+mmss(Date.now()-stampMs(h.ack.at))+'</span></div>'
      + '<button onclick="clearHelp()">All good — close it</button></div></div>';
  var age = Date.now()-stampMs(h.at);
  return '<div class="dock"><div class="hstate wait"><div class="r">'+ICON.hand
    + '<b>Waiting for the front desk</b><span class="t2">'+mmss(age)+'</span></div>'
    + (h.reason ? '<div style="margin-top:5px;opacity:.93">'+esc(h.reason)+'</div>'
       : '<div class="cr">'+['Extra hands','Supplies','A question','The client needs something']
           .map(function(r){ return '<button onclick="helpWhy(\''+esc(r)+'\')">'+esc(r)+'</button>'; }).join('')
         +'</div>')
    + '<button onclick="clearHelp()">'+(age<10000?'Never mind':'No longer needed')+'</button></div></div>';
}
/* HER SCREEN STAYS AWAKE WHILE SHE IS WAITING.
 * A phone propped against the station locks after thirty seconds, and then the answer —
 * "someone is coming" — arrives on a black screen she has to pick up and unlock to see,
 * with her hands wet. The lock is held only while a request is open, so the cost is bounded
 * by the request, and the tap that raises the hand is the user gesture the API requires. */
var WAKE = null;
function keepAwake(on){
  try {
    if (on && navigator.wakeLock && !WAKE)
      navigator.wakeLock.request('screen').then(function(w){ WAKE = w; })['catch'](function(){});
    if (!on && WAKE){ WAKE.release(); WAKE = null; }
  } catch (e) {}
}
/* A wake lock is dropped by the browser whenever the page is hidden, so it has to be
   re-taken on return or it silently stops working after the first glance away. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && S.help && !S.help.cleared) keepAwake(true);
});

function askHelp(){
  keepAwake(true);
  api('help',{token:S.token}).then(function(r){
    if (r.existing){ toast('You already have a request open.'); return; }
    toast(ICON.check+' Sent — the front desk can see it.'); refresh();
  })['catch'](function(e){ keepAwake(false); toast(e.message,'err'); });
}
function helpWhy(r){ api('helpReason',{token:S.token,reason:r}).then(refresh)['catch'](function(e){ toast(e.message,'err'); }); }
function clearHelp(){
  api('helpClear',{token:S.token,how:'tech'}).then(function(){
    keepAwake(false); toast('Closed.'); refresh();
  })['catch'](function(e){ toast(e.message,'err'); });
}

/* ─────────────────────────── alerts ─────────────────────────── */
var FEED = [];
function unseen(){ return FEED.filter(function(e){ return !S.seen[e.id]; }); }
function evText(e){
  var p = e.payload||{}, nm = '<b>'+esc(visitName(e.rowKey))+'</b>';
  function ba(was,now){ return '<span class="ba">'+(was?'<span class="was">'+esc(was)+'</span><span class="arrow">→</span>':'')
    + '<b>'+esc(now)+'</b></span>'; }
  switch(e.type){
    case 'WALKIN_ADD': return 'Walk-in <b>'+esc(p.name)+'</b> added'+(p.at?' at '+esc(p.at):'');
    case 'SVC_CHANGE': return nm+' service '+ba(p.from?p.from+' · '+money(p.fromPrice):'', p.to+' · '+money(p.price));
    /* Before -> after, like every other change to what she pays. The server has always sent
       fromPrice and toPrice; this line printed the label and threw the numbers away, so the
       one update that silently raises a bill was the one that did not show it. */
    case 'ADDON':      return nm+' add-on <b>'+esc(p.label||p.name)+'</b>'
                       + (p.toPrice ? ' ' + ba(money(p.fromPrice), money(p.toPrice)) : '');
    /* Print the brief itself. "It is on her card" made her go and look, mid-service, for
       something that could have been in front of her. */
    case 'DESIGN_BRIEF': return nm+' wants <b>'+esc(p.text||'a design — see her card')+'</b>'
                       + (p.photos ? ' <span class="quiet">('+p.photos+' photo'
                          +(p.photos>1?'s':'')+' on her card)</span>' : '');
    case 'DESK_NOTE':  return nm+' — <b>'+esc(p.text||'a note from the front desk')+'</b>';
    default: return nm+' '+esc(e.type.toLowerCase().replace(/_/g,' '));
  }
}
/* Events carry the hashed handle, not the raw key — so match on that. */
function visitName(rowKey){
  var v = S.visits.filter(function(x){ return x.rowKey === rowKey; })[0];
  return v ? v.name : 'Your chair';
}
/* Only what the DESK sent her. Her own signals coming back would alert her about herself. */
function mine(e){ return e.who !== S.tech && e.type.indexOf('HELP') !== 0; }

function paintAlert(){
  /* #alertveil, never #veil. This used to reach for the same element the composer uses, and
     the very next poll — four seconds later — set its className back to closed. The
     must-know box vanished mid-sentence, which read as the app refusing to open it. */
  var el = $('alertveil'), pend = unseen();
  if (!pend.length){ el.className='veil'; S.shownIds=[]; return; }
  var wasOpen = el.classList.contains('on');
  var fresh = wasOpen ? pend.filter(function(e){ return S.shownIds.indexOf(e.id)<0; }).map(function(e){return e.id;}) : [];
  S.shownIds = pend.map(function(e){ return e.id; });
  el.className = 'veil on';
  el.innerHTML = '<div class="alert"><div class="hd"><img src="'+LOGO+'" alt="" class="hdmark">From the front desk · '
    + pend.length+(pend.length>1?' updates':' update')+'</div>'
    + pend.slice().reverse().map(function(e){
        return '<div class="item'+(fresh.indexOf(e.id)>=0?' fresh':'')+'">'+evText(e)
          + '<div class="who">'+esc(e.who||'')+'</div></div>'; }).join('')
    + (fresh.length?'<div class="newline">'+fresh.length+' arrived while you were reading — included above.</div>':'')
    + '<button class="btn" style="margin-top:12px" onclick="ackShown()">Got it'
    + (pend.length>1?' — all '+pend.length:'')+'</button></div>';
}
/* Acknowledges EXACTLY what was on screen. Anything that lands a heartbeat later stays
   pending and the card simply stays open with it. Nothing can be marked read unread. */
function ackShown(){
  S.shownIds.forEach(function(id){ S.seen[id] = true; });
  paintAlert(); refreshBell(); render();
}
function openBell(){
  var el=$('veil');
  el.className='veil on';
  el.innerHTML = '<div class="alert"><div class="hd"><img src="'+LOGO+'" alt="" class="hdmark">From the front desk</div>'
    + (FEED.length ? FEED.slice().reverse().slice(0,14).map(function(e){
        return '<div class="item">'+(S.seen[e.id]?'':'<b style="color:var(--gold)">NEW </b>')
          + evText(e)+'<div class="who">'+esc(e.who||'')+'</div></div>'; }).join('')
      : '<p class="lede">Nothing yet today.</p>')
    + '<div class="row2"><button class="skip" style="flex:1" onclick="shutVeil()">Close</button>'
    + (unseen().length?'<button class="btn" style="flex:1" onclick="ackAll()">Mark all seen</button>':'')
    + '</div></div>';
}
function shutVeil(){ var v=$('veil'); v.className='veil'; v.innerHTML=''; }
function ackAll(){ FEED.forEach(function(e){ S.seen[e.id]=true; }); shutVeil(); refreshBell(); render(); }
function refreshBell(){
  var el = document.querySelector('.bellcount'); if (!el) return;
  var n = unseen().length; el.textContent = n||''; el.style.display = n?'flex':'none';
}

/* ══════════════════ INSTANT, WHEN THERE IS A CHANNEL ══════════════════
 * Apps Script cannot push, and cannot be polled fast enough to feel live: a consumer account
 * has 90 MINUTES of script runtime a day and Rebook's sync already spends half of it. So the
 * server rings a doorbell on an outside channel and this page holds that connection open.
 * When it rings we call the book once — under a second, and a few hundred calls a day instead
 * of many thousands.
 *
 * EventSource, not a websocket library: built into every phone browser, reconnects by itself,
 * and adds no dependency to a page served from GitHub.
 *
 * With REALTIME empty everything still works on the slow poll below. The channel makes it
 * instant; it is never what makes it function.
 */
var REALTIME = '';                     // e.g. https://<project>.firebaseio.com/tick.json
var ES = null, ESFAIL = 0;

function listen(){
  if (!REALTIME || !window.EventSource || ES) return;
  try {
    ES = new EventSource(REALTIME + (REALTIME.indexOf('?') < 0 ? '?' : '&') + 'x=' + Date.now());
    ES.addEventListener('put',   function(){ ESFAIL = 0; refresh(true); });
    ES.addEventListener('patch', function(){ ESFAIL = 0; refresh(true); });
    ES.onerror = function(){
      /* Back off and never spin: a phone in a dead-wifi corner must not sit reopening a
         socket for an hour. The poll keeps working throughout. */
      try { ES.close(); } catch (e) {}
      ES = null; ESFAIL++;
      if (ESFAIL < 6) setTimeout(listen, Math.min(60000, 2000 * Math.pow(2, ESFAIL)));
    };
  } catch (e) { ES = null; }
}

/* ─────────────────────────── the poll ───────────────────────────
 * WHAT WE MEASURED, AND WHY THE INTERVAL MOVES.
 *
 * A call to Apps Script costs ~0.9 seconds of waiting no matter what it does — measured on
 * the live deployment, and it is the same 0.9s for a door that never opens the spreadsheet
 * and for one that reads the whole day. It is Google's dispatch, not our code, so no amount
 * of tuning on this side makes a single refresh feel instant.
 *
 * A CORRECTION worth writing down, because the first version of this comment got it wrong.
 * The "90 minutes of script runtime a day" limit is labelled "TRIGGERS total runtime" in
 * Google's quota table. Polling a web app does not spend it — Rebook's every-minute sync
 * trigger does. These intervals were originally stretched to protect a budget that was
 * never at risk.
 *
 * What actually sets the pace: the 0.9s floor above, "simultaneous executions per user: 30"
 * (six phones and a desk never approach it), and not hammering the spreadsheet.
 *
 * After anything arrives, poll every 4 seconds, backing off by half again per quiet poll to
 * 15. Fifteen is the real number: it is the longest she can go without hearing that her
 * client's service changed. Anything she taps snaps it back to fast, and a dark screen does
 * not poll at all — a phone face-down on the station is free.
 */
var POLLT = null, POLL_HOT = 4000, POLL_COLD = 15000, POLL_MS = POLL_HOT;
function pollHot(){ POLL_MS = POLL_HOT; poll(); }              // something happened: lean in
function pollCool(){ POLL_MS = Math.min(POLL_COLD, Math.round(POLL_MS * 1.5)); }
function pollMs(){ return ES ? 300000 : POLL_MS; }             // a live channel makes this a net
function poll(){
  clearTimeout(POLLT);
  var ms = pollMs();
  /* Jittered, so six phones that all opened at the morning meeting do not knock together. */
  POLLT = setTimeout(function(){ if (!document.hidden) refresh(true); poll(); },
                     ms + Math.round((Math.random() - 0.5) * ms * 0.3));
}
document.addEventListener('visibilitychange', function(){
  if (document.hidden) return;
  refresh(true);
  pollHot();                      // she just picked the phone up: she is about to do something
  listen();                       // a backgrounded phone usually has its socket cut
});

/**
 * What a techPoll answer means for the feed — in ONE place, because opening the app and
 * refreshing it both do this, and the day they disagree is the day an alert is shown twice
 * or not at all.
 */
/**
 * What a techPoll answer means for the feed. One place, because opening the app and
 * refreshing it both do this and the day they disagree is the day an alert is shown twice or
 * not at all.
 *
 * Returns TRUE when the day rolled over, meaning the caller must fetch again from zero.
 * Resetting the cursor here is not enough on its own: this response was already filtered
 * server-side against YESTERDAY's cursor, and `S.cursor = r.cursor` below would immediately
 * put the cursor back at today's newest id — so the morning's first events would be skipped
 * exactly as before. The reset only counts if a fresh request follows it.
 *
 * `quiet` is for opening the app. The day's history belongs in the bell, not in a full-screen
 * modal — a technician who reloads at two in the afternoon should not have to dismiss every
 * update since nine.
 */
function absorb(r, quiet){
  if (r && r.date && S.day && r.date !== S.day){
    S.cursor = 0; FEED.length = 0; S.seen = {}; S.shownIds = [];
    S.day = r.date;
    return true;                  // caller refetches; next time round S.day matches, so once only
  }
  if (r && r.date) S.day = r.date;

  /* Kept by id. The cursor normally prevents a repeat, but a retry, a doorbell ring and a
     poll can overlap, and the same event landing twice shows the same alert twice — which
     reads as two clients needing something when only one does. */
  var have = {};
  FEED.forEach(function(e){ have[e.id] = 1; });

  var fresh = (r && r.events ? r.events : []).filter(mine).filter(function(e){ return !have[e.id]; });
  fresh.forEach(function(e){
    FEED.push(e);
    if (quiet) S.seen[e.id] = true;     // already history when she opened the app
  });
  if (r && r.cursor) S.cursor = r.cursor;

  /* Hot only for things SOMEBODY ELSE did. Her own tap already refreshed the screen, and
     letting it hold the phone at 4 seconds spends the salon's budget on nothing. */
  var fromElsewhere = fresh.filter(function(e){ return e.who !== S.tech; });
  if (!quiet && fromElsewhere.length) pollHot(); else pollCool();
  return false;
}

/* A poll that fails must SAY so. A frozen day and a quiet day look identical, and a
   technician has no way to tell that the last twenty minutes of updates never arrived. */
var POLLFAIL = 0;
function pollTrouble(on){
  POLLFAIL = on ? POLLFAIL + 1 : 0;
  var el = $('offline');
  if (!el) return;
  el.style.display = POLLFAIL >= 3 ? 'block' : 'none';
}

/* ONE call, not two. This used to ask techToday and then dayFeed, which is two executions
   and two lots of that 0.9s — for one refresh. techPoll answers both. */
var REFRESHING = false;
function refresh(quiet){
  /* One at a time. Two overlapping polls both read the cursor before either writes it, so
     both fetch the same events and the second pushes duplicates. */
  if (!S.token || REFRESHING) return;
  REFRESHING = true;
  api('techPoll', { token:S.token, since:S.cursor }).then(function(r){
    REFRESHING = false;
    pollTrouble(false);
    S.visits = r.visits; S.help = r.help; S.caps = r.caps||S.caps;
    if (r.vocab && r.vocab.length) S.vocab = r.vocab;
    S.changes = r.changes || [];
    if (S.key) S.visit = S.visits.filter(function(v){ return v.key===S.key; })[0] || S.visit;
    if (absorb(r)) { refresh(quiet); return; }     // the day rolled: start it from zero
    render(); paintAlert(); refreshBell();
  })['catch'](function(e){
    REFRESHING = false;
    if (/not signed in/.test(e.message)){ dropToken(); S.token=''; S.view='enrol'; render(); return; }
    pollTrouble(true);
    if (!quiet) toast(e.message,'err');
  });
}

function render(){
  if (S.view==='enrol' || !S.token) return viewEnrol();
  if (S.view==='visit') return viewVisit();
  return viewToday();
}

/* The help timers tick without a round trip — the clock is local, the state is the ledger's. */
setInterval(function(){ if (S.token && S.help) render(); }, 1000);

(function boot(){
  var t = loadToken();
  if (!t){ S.view='enrol'; render(); return; }
  S.token = t; loadDay(); listen();
})();
</script>
</body>
