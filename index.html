<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- WITHOUT THIS TAG A PHONE DOES NOT RENDER A PHONE LAYOUT.
     Mobile Safari lays an unmarked page out at 980px CSS pixels and then scales the whole
     thing down to fit, so every word and every button comes out about a third of its
     intended size. The app was never sized for a phone; it was a desktop page being
     shrunk. viewport-fit=cover lets the ivory run under the notch and the home bar, which
     is what the safe-area padding below is compensating for. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Added to the Home Screen this opens with no browser chrome — no address bar, no tabs.
     That is the difference between "a website the salon uses" and "the salon's app". -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Day">
<meta name="theme-color" content="#FBF8F5">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Artonus — My Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* House skin, unchanged from the fleet: the same ivory, espresso and gold, Cormorant for
     names and Lato for everything you have to read fast. Line-art icons only — no emoji in
     an Artonus UI, ever. */
  :root{
    --ivory:#FBF8F5; --card:#FFFDFB; --espresso:#2B0B00; --ink:#3B2A22; --muted:#8A7A6E;
    --gold:#B0894F; --gold-soft:#F3EADF; --line:#EADFD3;
    --ok:#3F7D5A; --ok-soft:#EEF6F0; --err:#A4392B; --err-soft:#FBEEEB; --err-line:#E8C9C2;
    --warn:#8A6D2F; --warn-soft:#FBF3E2;

    /* ══ ONE SPACING SCALE ══════════════════════════════════════════════════════════════
       Every gap on this page used to be its own number — 4, 5, 6, 8, 10, 11, 12, 14, 16 —
       chosen a screen at a time. Nothing was badly wrong and nothing lined up either, which
       is what makes a page feel homemade: the eye reads inconsistent rhythm as carelessness
       long before it can name what is off.

       Four steps, and they mean something:
         s1  inside one thing        (a label and the thing it labels)
         s2  between related things  (two buttons doing the same job)
         s3  between blocks          (one card and the next)
         s4  between sections        (a new heading, a new subject) */
    --s1:6px; --s2:10px; --s3:16px; --s4:22px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--ivory);color:var(--ink);
    font-family:Lato,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.55}
  /* min-height 100% + the ivory on html: without it a short screen (the code entry, an empty
     morning) leaves the page background showing below the content, which reads as a broken
     half-drawn page rather than an app. */
  html{min-height:100%;-webkit-text-size-adjust:100%;
       /* ANDROID CHROME PULL-TO-REFRESH ATE HALF-TYPED NOTES. A drag down anywhere near the
          top reloads the page, and a technician two sentences into a note about a client's
          reaction lost both. overscroll-behavior on the BODY alone does not stop it — Chrome
          reads the property off the viewport-defining element, which is html. */
       overscroll-behavior-y:contain}

  /* ══ TOUCH ══════════════════════════════════════════════════════════════════════════════
     A phone has no hover, so a button that only changes on :hover confirms nothing when it is
     tapped. These four lines are most of the difference between "a website on a phone" and
     "an app": no 300ms wait for a double-tap that is never coming, no grey flash box, no text
     selection bubble from a thumb resting a moment too long, and a real press state. */
  button,.pill,.tag,.c,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none}
  button:active,.pill:active{transform:scale(.975)}
  button,.pill{transition:transform .06s ease-out}
  @media (prefers-reduced-motion:reduce){ button,.pill{transition:none} button:active,.pill:active{transform:none} }
  body{min-height:100vh;min-height:100dvh;
       padding:calc(8px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
               calc(24px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
       max-width:520px;margin:0 auto;
       /* A standalone app must not rubber-band like a web page. */
       overscroll-behavior-y:none}
  h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;color:var(--espresso);margin:0}
  .hdr{text-align:center;padding:18px 0 10px}
  .hdr img{height:26px;opacity:.92}
  .hdr h1{font-size:30px;margin-top:6px;letter-spacing:.2px}
  .hdr .sub{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted);margin-top:3px;font-weight:800}
  .anav{display:flex;gap:var(--s2);align-items:center;justify-content:space-between;
    margin:var(--s1) 0 var(--s3)}
  /* 44px, because a thumb is not a mouse pointer. These were 33 and the Alerts pill is the
     one thing on this screen she taps while holding somebody's hand. */
  .pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:0 14px;min-height:44px;font-size:12.5px;font-weight:800;
    color:var(--espresso);cursor:pointer;position:relative}
  .pill svg{width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dot{position:absolute;top:-5px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--err);
    color:#fff;font-size:10.5px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:var(--s3);margin-bottom:var(--s2)}
  .card h3{font-size:21px}
  /* A heading needs a breath before the first thing under it. */
  .card h3+.lbl{margin-top:var(--s2)}
  .lede,.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
  .in,.ta{width:100%;font-family:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;background:var(--card);color:var(--ink);margin-bottom:var(--s2)}
  .ta{resize:vertical;min-height:78px}
  .in:focus,.ta:focus{outline:none;border-color:var(--gold)}
  .btn{width:100%;min-height:50px;border:none;border-radius:14px;background:var(--espresso);color:#FBF8F5;
    font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;display:flex;align-items:center;
    justify-content:center;gap:8px}
  .btn:disabled{opacity:.5}
  /* Two decisions STACKED are two decisions, not one tall block.
     ONLY WHEN STACKED. This rule shipped without the :not() and every horizontal row on the
     phone came out wrong in the same way: the first button kept its place and every one after
     it was pushed down 10px, and because the row stretches to a common height, pushing them
     down made them SHORTER too. Trung saw it as 'the first chip is larger than the others' —
     three times over, on the photos, the minutes and the two service buttons. A margin meant
     for a column has no business inside a row. */
  .btn+.btn,.btn+.skip,.skip+.btn,.skip+.skip{margin-top:var(--s2)}
  .sigrow>*+*,.row2>*+*,.chips>*+*{margin-top:0}
  .card+.lbl{margin-top:var(--s4)}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .ghost{background:var(--card);border:1px solid var(--line);color:var(--espresso)}
  .skip{background:transparent;border:1px solid var(--line);color:var(--muted);min-height:44px;border-radius:12px;
    font-family:inherit;font-weight:800;font-size:13.5px;cursor:pointer;padding:0 15px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px}
  /* EVERY icon, sized and stroked, once. An SVG that misses its rule renders at the
     browser's default box with a filled path — which is how "Send" became a black blob. */
  /* EVERY inline icon has a size, whatever it sits in. An <svg> with a viewBox and no width
     expands to fill its container, so an icon dropped into a plain <div> renders the height
     of the card and shoves the text off the screen — which happened twice in one evening,
     once in the design-brief panel and once in the more-time note. The rules below are all
     more specific and still win; this is only the floor. */
  svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;
      stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
  button svg,.pill svg,.tag svg{width:15px;height:15px;flex:none;fill:none;stroke:currentColor;
    stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .btn svg{width:17px;height:17px}
  .sigbtn svg,.pill svg{stroke:var(--gold)}
  .sigbtn.sent svg,.hstate svg,.btn svg{stroke:currentColor}
  .helpbtn svg{width:18px;height:18px;stroke:var(--err)}
  /* Stretch, so a text box and the button beside it are the same height. They were 48 and 44
     and the row read as slightly broken. */
  .row2{display:flex;gap:var(--s2);margin-top:var(--s2);align-items:stretch}
  .row2>*{min-height:48px}
  /* A section heading opens a subject, so it gets the big gap above and the small one below —
     the label belongs to what FOLLOWS it, and the spacing should say so. */
  .lbl{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;font-weight:900;
    color:var(--muted);margin:var(--s4) 0 var(--s1)}
  .card>.lbl:first-child,.lbl:first-child{margin-top:0}
  .sigrow{display:flex;flex-wrap:wrap;gap:var(--s1)}
  /* The end of the visit, kept together and set apart, so the middle of the screen is not
     carrying it all appointment long. A hairline, not another card — it is still the same
     card, just a later part of it. */
  /* Two kinds, side by side, one always chosen — the same control the desk got. */
  .kindpick{display:grid;grid-template-columns:1fr 1fr;gap:var(--s1);margin:var(--s2) 0 var(--s2)}
  .kind{text-align:left;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--card);font-family:inherit}
  .kind b{display:block;font-size:14px;font-weight:900;color:var(--espresso)}
  .kind small{display:block;margin-top:2px;font-size:11px;font-weight:700;color:var(--muted);line-height:1.35}
  .kind.on{border-color:var(--gold);background:var(--gold-soft)}
  .kind.warn.on{border-color:var(--err);background:var(--err-soft)}
  .kind.warn.on b{color:var(--err)}
  .endblk{margin-top:var(--s4);padding-top:var(--s3);border-top:1px solid var(--line)}
  .endhd{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;font-weight:700;
    color:var(--espresso);margin-bottom:var(--s1)}
  .endblk>.lbl:first-of-type{margin-top:var(--s3)}
  .sigbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;min-height:44px;padding:0 13px;font-family:inherit;font-size:13.5px;font-weight:800;
    color:var(--espresso);cursor:pointer}
  .sigbtn svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sigbtn:disabled{opacity:.55}
  .sigbtn.sent{background:var(--ok);border-color:var(--ok);color:#fff}
  .sigbtn.sent svg{stroke:#fff}
  /* A note is a record of today; a must-know is a lasting fact about her care. Two adjacent
     buttons that do different things must not look identical. */
  .sigbtn.mk{background:var(--gold-soft);border-color:#E7D6BE}
  /* A taken photo becomes the tile. Retake is the smaller, second tap — the common action
     once it is shot is looking at it, not replacing it. */
  .shot{display:flex;flex-direction:column;gap:4px}
  .shotbtn{width:100%;min-height:74px;border:1px solid var(--ok);border-radius:12px;cursor:pointer;
    background:var(--ok-soft) center/cover no-repeat;position:relative;overflow:hidden;
    display:flex;align-items:flex-end;justify-content:center;padding:0}
  /* A slot with a photograph still travelling: her picture, dimmed, with the word on it. The
     gold ring is the same one the note composer uses, so "this is going up" looks the same
     everywhere in the app. */
  .shotbtn.sending{opacity:.62;border-color:var(--gold);animation:shotpulse 1.2s ease-in-out infinite}
  .shotbtn.sending .cap{background:linear-gradient(transparent,rgba(43,11,0,.78))}
  .shotbtn .cap{width:100%;background:linear-gradient(to top,rgba(43,11,0,.72),rgba(43,11,0,0));
    color:#fff;font-size:11px;font-weight:900;letter-spacing:.6px;padding:12px 0 4px}
  .retake{background:none;border:none;color:var(--muted);font-family:inherit;font-size:11px;
    font-weight:800;cursor:pointer;padding:2px;text-decoration:underline}
  .rchip{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px dashed var(--line);
    border-radius:999px;min-height:38px;padding:0 13px;font-family:inherit;font-size:13px;font-weight:800;
    color:var(--muted);cursor:pointer}
  .rchip.on{background:var(--espresso);border:1px solid var(--espresso);color:#FBF8F5}
  .rchip svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .visit{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px;margin-bottom:var(--s2);cursor:pointer}
  .visit .t{font-weight:900;font-size:13px;color:var(--espresso);min-width:62px}
  .visit .nm{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--espresso);line-height:1.15}
  .visit .sv{font-size:12.5px;color:var(--muted)}
  .tag{display:inline-block;font-size:10px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
    border-radius:999px;padding:3px 9px;margin-top:4px}
  .tag.book{background:var(--gold-soft);color:var(--warn)}
  .tag.serv{background:var(--ok-soft);color:var(--ok)}
  .tag.done{background:var(--line);color:var(--muted)}
  .tag.walk{background:var(--warn-soft);color:var(--warn)}
  .flag{background:var(--err-soft);border:1px solid var(--err-line);border-radius:12px;
    padding:12px 13px;margin-bottom:var(--s2)}
    /* Big enough to actually copy a design from, on a phone, at arm's length. */
    .briefshot{display:block;width:100%;height:190px;margin:var(--s2) 0 var(--s1);border:1px solid var(--gold);border-radius:12px;background-size:cover;background-position:center;position:relative;padding:0}
    .briefshot .cap{position:absolute;left:0;right:0;bottom:0;padding:6px;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));border-radius:0 0 11px 11px}
    /* A must-know she has confirmed stops shouting, so the unread ones stand out.
       AN ALLERGY NEVER GOES QUIET. Trung, 17 August: 'the allergy must-know after acknowledged
       becomes discreet, I need it to be prominent, because it is important information.'
       Reading it once does not stop it being true, and she is looking at this card in the
       middle of a service, not at the start. Only the confirmation goes quiet. */
    .flag--read{background:var(--card);border-color:var(--line)}
    .flag--allergy{background:var(--err-soft);border:2px solid var(--err)}
    .flag--allergy .k{font-size:11px}
    .flag--allergy .body{font-weight:800}
    .btn--ack{margin-top:var(--s2);padding:8px 14px;font-size:14px;min-height:40px;background:var(--err);border-color:var(--err);color:#fff}
    .ackdone{margin-top:var(--s1);font-size:13px;color:var(--ok);font-weight:600}
  .flag .k{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;font-weight:900;color:var(--err)}
  .flag .body{font-size:15px;line-height:1.4;margin-top:2px}
  /* A read allergy keeps its red heading; a read anything-else lets go of it. */
  .flag--read .k{color:var(--muted)}
  .flag--allergy .k{color:var(--err)}
  .note{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 13px;margin-bottom:var(--s2);font-size:13.5px}
  .note .by{font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}
  /* The photographs on a past note — the same record the front desk sees. */
  /* An instruction for whoever books them next, not a record of a day that is over. */
  .tip{display:flex;gap:7px;align-items:flex-start;margin-top:var(--s2);padding:8px 10px;
    background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;
    font-size:13px;font-weight:700;color:var(--espresso);line-height:1.4}
  .tip svg{width:14px;height:14px;stroke:var(--gold);fill:none;stroke-width:2;
    stroke-linecap:round;flex:none;margin-top:2px}
  .nshots{display:flex;gap:var(--s1);margin-top:var(--s2);flex-wrap:wrap}
  .nshots img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);
    background:var(--line)}
  /* Busy, not broken. A blank square reads as a failure. */
  .nshots img.wait{animation:shotpulse 1.1s ease-in-out infinite}
  @keyframes shotpulse{0%,100%{opacity:.35}50%{opacity:.8}}
  .nshots img.sending{opacity:.6;border-color:var(--gold)}
  .nshot-add{width:72px;height:72px;border-radius:10px;border:1px dashed var(--line);background:none;
    font-family:inherit;font-size:11px;font-weight:800;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s1);margin:var(--s1) 0}
  .c{display:inline-block;background:var(--gold-soft);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800;color:var(--espresso)}
  /* A chip she TAPS, not one she reads. Bigger than a label because it is a target for a
     thumb on a phone, held by someone whose other hand is busy. */
  .c.pick{border:1px solid var(--gold);background:none;font:inherit;font-size:13px;
    font-weight:800;padding:9px 14px;min-height:40px;cursor:pointer;color:var(--espresso)}
  .c.pick.on{background:var(--espresso);border-color:var(--espresso);color:#FBF8F5}
  .stars{color:var(--gold);letter-spacing:2px}
  /* THE ALERT — centred, everything behind it dimmed, and it stays until acknowledged. */
  .veil{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;padding:18px;
    background:rgba(43,11,0,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
  .veil.on{display:flex}
  .alert{background:var(--card);border-radius:18px;padding:18px 17px 16px;width:100%;max-width:340px;
    box-shadow:0 22px 60px rgba(43,11,0,.45);max-height:84vh;overflow:auto}
  .alert .hd{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:1.8px;text-transform:uppercase;
    font-weight:900;color:var(--gold);margin-bottom:10px}
  .alert .hd svg{width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:2}
  .alert .item{border-top:1px solid var(--line);padding:9px 0;font-size:13.5px;line-height:1.5}
  .alert .item:first-of-type{border-top:none;padding-top:2px}
  .alert .item .who{font-size:11px;color:var(--muted);margin-top:2px}
  .alert .item.fresh{background:var(--gold-soft);margin:0 calc(var(--s3) * -1);padding-left:8px;padding-right:8px;border-radius:8px}
  .alert .newline{font-size:11.5px;color:var(--gold);font-weight:800;margin-top:var(--s2)}
  .ba .was{color:var(--muted);text-decoration:line-through}
  .ba .arrow{color:var(--gold);font-weight:900}
  /* Help: her own dock, always reachable, never mixed with routine signals. */
  .dock{position:sticky;bottom:0;margin:16px -16px 0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--ivory) 74%,rgba(251,248,245,0));z-index:40}
  .helpbtn{width:100%;border:1.5px solid var(--err-line);background:var(--err-soft);color:var(--err);
    border-radius:14px;min-height:52px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .helpbtn svg{width:18px;height:18px;fill:none;stroke:var(--err);stroke-width:2.2;stroke-linecap:round}
  .hstate{border-radius:14px;padding:11px 13px;font-size:13px}
  .hstate.wait{background:var(--err);color:#fff}
  .hstate.coming{background:var(--ok);color:#fff}
  .hstate .r{display:flex;align-items:center;gap:8px}
  .hstate .r b{font-size:14px}
  .hstate .t2{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:900}
  .hstate svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
  .hstate button{width:100%;margin-top:var(--s2);border:none;border-radius:10px;min-height:38px;font-family:inherit;
    font-size:12.5px;font-weight:900;cursor:pointer;background:rgba(255,255,255,.92);color:var(--err)}
  .hstate.coming button{color:var(--ok)}
  .hstate .cr{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
  .hstate .cr button{width:auto;margin:0;background:rgba(255,255,255,.16);color:#fff;
    border:1px solid rgba(255,255,255,.35);border-radius:16px;min-height:32px;padding:0 11px;font-size:11.5px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));
    background:var(--espresso);color:#FBF8F5;padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:700;
    z-index:200;display:none;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(43,11,0,.35)}
  .toast.on{display:block}
  .toast.err{background:var(--err)}
  /* The page could not update itself. Pinned to the top, not a toast, because the one thing
     she must not do is glance past it — she would carry on working from code we have already
     replaced. Kept below #offline, which is the more urgent of the two. */
  .stale{position:fixed;left:0;right:0;top:0;z-index:98;background:var(--gold);color:#2B0B00;
    padding:calc(9px + env(safe-area-inset-top)) 14px 9px;font-size:12.5px;font-weight:800;
    line-height:1.45;display:none;text-align:center}
  .stale.on{display:block}
  .quiet{color:var(--muted)}
  .mtnum::-webkit-outer-spin-button,.mtnum::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #offline{position:fixed;left:0;right:0;top:0;z-index:99;background:#8a1c1c;color:#fff;
    font-size:12.5px;font-weight:800;text-align:center;
    padding:calc(7px + env(safe-area-inset-top)) 12px 7px}
  /* The boot skeleton. Deliberately the SHAPE of the day list she is about to see, not a
     spinner — a spinner says "wait", a skeleton says "it is coming, and here is where". */
  .bootskel{padding-top:6px}
  .bootskel .hdr{display:flex;flex-direction:column;align-items:center;gap:10px}
  .bootskel .skel{height:13px;border-radius:7px;margin:var(--s1) 0;
    background:linear-gradient(90deg,rgba(43,11,0,.055) 25%,rgba(43,11,0,.11) 37%,rgba(43,11,0,.055) 63%);
    background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite}
  .bootskel .skel-logo{width:30px;height:30px;border-radius:9px;margin:var(--s3) 0 0}
  .bootskel .skel-title{width:132px;height:26px;border-radius:8px}
  .bootskel .skel-btn{height:48px;border-radius:14px;margin-top:16px}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
  @media(prefers-reduced-motion:reduce){.bootskel .skel{animation:none}}
  /* The searchable pickers — the service list and the add-on list. Rows, not a <select>:
     a native select on a phone hides the price, and the price is the point. */
  .picklist{max-height:46vh;overflow-y:auto;margin-top:var(--s2)}
  .pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;
    text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;
    min-height:52px;padding:9px 13px;margin-bottom:var(--s1);font-family:inherit;font-size:14.5px;
    font-weight:800;color:var(--ink);cursor:pointer}
  .pick:disabled{opacity:.55}
  /* CHOSEN, not sent. Nothing leaves the phone until she presses Send, so this state has to
     look like a decision she can still take back — the salon's gold, not the espresso a
     finished action wears. */
  .pick.on{background:var(--gold-soft);border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
  .pick.on .quiet{color:var(--espresso)}
  .pick .quiet{font-weight:700;font-size:12.5px;color:var(--muted)}
  /* The salon's own mark in the alert header, not a stock bell. A technician sees this a
     dozen times a day; it should look like it belongs to Artonus. */
  .alert .hd .hdmark{height:16px;width:auto;margin-right:8px;vertical-align:-3px;opacity:.95}
  /* The running list of what this chair has already told the desk. */
  .sigbtn.sent{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .sigbtn.sent svg{stroke:var(--ok)}
  .sigbtn:disabled{opacity:1;cursor:default}
  /* The design brief — gold, above everything, because it is the thing she is about to do. */
  .brief{display:flex;gap:9px;align-items:flex-start;background:var(--gold-soft);
    border:1px solid var(--gold);border-radius:14px;padding:12px 13px;margin-bottom:var(--s2);
    font-size:14px;line-height:1.5}
  .brief svg{flex:none;stroke:var(--gold);margin-top:2px;width:16px;height:16px}
  .tag.want{background:var(--gold-soft);border-color:var(--gold);color:var(--espresso)}
    /* Red on purpose. This is the one tag that means stop and read before you start. */
    .tag.must{background:var(--err-soft);border-color:var(--err-line);color:var(--err);font-weight:700}
  .tag.want svg{width:11px;height:11px;stroke:var(--gold);vertical-align:-1px;margin-right:3px}
  /* Moves and cancellations — the day rearranging itself, said out loud. */
  .changes{margin-bottom:10px}
  .chg{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft,#FBF3E2);
    border:1px solid var(--warn,#8A6D2F);border-radius:12px;padding:9px 12px;margin-bottom:6px;
    font-size:13.5px;line-height:1.45}
  .chg svg{flex:none;stroke:var(--warn,#8A6D2F);margin-top:2px;width:16px;height:16px}
  .chg .was{text-decoration:line-through;color:var(--muted);margin-right:4px}
  .chg .arrow{color:var(--muted);margin-right:4px}
</style>
</head>
<body>
<div id="offline" style="display:none">Not reaching the front desk — what you see may be out of date.</div>
<!-- THE FIRST PAINT, before a byte of JS runs.
     A call to Apps Script costs about a second no matter what it does, and until now that
     second was a blank ivory screen: nothing to say the app had started, nothing to say it
     was working. A technician taps the icon, sees nothing, and taps again. -->
<div id="app"><div class="bootskel" aria-hidden="true">
  <div class="hdr"><div class="skel skel-logo"></div><div class="skel skel-title"></div></div>
  <div class="card">
    <div class="skel" style="width:52%;height:17px;margin-bottom:14px"></div>
    <div class="skel" style="width:100%"></div>
    <div class="skel" style="width:88%"></div>
    <div class="skel skel-btn"></div>
  </div>
  <div class="card">
    <div class="skel" style="width:40%;height:17px;margin-bottom:14px"></div>
    <div class="skel" style="width:94%"></div>
    <div class="skel" style="width:70%"></div>
  </div>
</div></div>
<div class="veil" id="veil"></div>
<!-- SEPARATE FROM #veil ON PURPOSE. The alert repaints on every poll; the composer lives in
     #veil and must not be torn down by it. Sharing one element meant paintAlert() closed the
     must-know box every few seconds and it could not be filled in at all. -->
<div class="veil" id="alertveil"></div>
<div class="toast" id="toast"></div>
<!-- Shown only when the page could not update itself. It has to survive a re-render, so it
     lives here beside the toast rather than inside #app. -->
<div class="stale" id="stale"></div>

<script>
/* ══════════════════════════════════════════════════════════════════════════════
   THE CHAIR — the technician's phone.
   Everything here is a thin caller of Clients' write API. This file owns no data and
   decides no permissions: every door it knocks on re-checks the device token, and her
   chair-scoping is enforced there, not here.
   ══════════════════════════════════════════════════════════════════════════════ */
'use strict';

var ICON = {
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  /* Used by the cancellation line. Referencing an icon that does not exist prints the word
     "undefined" into the page, which is how a missing icon becomes a visible bug. */
  close:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  bell: '<svg viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9z"/><path d="M10.5 18a1.8 1.8 0 0 0 3 0"/></svg>',
  hand: '<svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M8.5 7.5v5"/><path d="M15.5 7.5v5"/><path d="M5 12v3a7 7 0 0 0 14 0v-3"/></svg>',
  person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20a7.2 7.2 0 0 1 14.4 0"/></svg>',
  back: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  star: '<svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.8l5.9-.9z"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>',
  cam:  '<svg viewBox="0 0 24 24"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2L8 5h8l1.5 2h2A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.2"/></svg>'
};
var LOGO = 'https://static.wixstatic.com/media/1193d9_5794966292134434911d79c3d32d08a8~mv2.png/v1/fill/w_192,h_192,lg_1,usm_0.66_1.00_0.01/1193d9_5794966292134434911d79c3d32d08a8~mv2.png';

var S = { view:'boot', token:'', tech:'', chair:'', visits:[], help:null, caps:[],
          key:null, visit:null, cursor:0, seen:{}, shownIds:[], busy:false, session:0, day:'' };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return '$' + (Math.round((Number(n)||0)*100)/100).toFixed(2); }

var TOASTT;
/* The message is ESCAPED. This used to set innerHTML straight from the argument, and most
   callers pass server text — every toast(e.message,'err'), the colour label, the service
   name. A shade typed as markup would have run as markup. Our own icon markup goes in the
   third argument, the only thing allowed through unescaped. */
function toast(m,kind,icon){
  var t=$('toast'); t.innerHTML=(icon||'')+esc(m); t.className='toast on'+(kind==='err'?' err':'');
  clearTimeout(TOASTT); TOASTT=setTimeout(function(){ t.className='toast'; }, kind==='err'?4200:2400);
}

/* ══════════════════════ THE ONLY LINK TO GOOGLE ══════════════════════
 * This page is served from GitHub Pages, not from Google. That is the entire point: every
 * failure this app had on a phone — Drive's "unable to open the file", /u/N account routing,
 * an iframe nothing could reach into — came from asking a phone to LOAD a google.com page.
 * It does not any more. It loads from our own domain and calls one JSON endpoint.
 *
 * Content-Type is text/plain on purpose. application/json triggers a CORS preflight, Apps
 * Script cannot answer an OPTIONS request, and the browser gives up before the POST is sent.
 * A "simple request" goes straight through. Measured 2026-08-09.
 */
var BOOK = 'https://script.google.com/macros/s/AKfycby0SWGq-PC702gm02TV8mzrOw36wV1jL6P4XlJxpfAvLYs_bzDJ03qGYzrcD74vwX80/exec';

/* How many calls are in the air. Read by the updater below, which must never reload the page
   out from under a photo that is still uploading. */
var INFLIGHT = 0;

/**
 * A REQUEST THAT NEVER ANSWERS IS THE ONE THAT CAUSES THE DAMAGE.
 *
 * Trung, 17 August: a send that appeared to hang led to a second press, and both landed.
 * Without a deadline the phone waits on a dead socket for as long as the OS allows — long
 * enough that a technician reasonably concludes it failed and tries again.
 *
 * A timeout ALONE would make that worse, not better: giving up and retrying is exactly how
 * one press becomes two writes. It is only safe because every send now carries an opId the
 * server remembers for ten minutes, so a retry of a request that did land is answered from
 * that memory instead of written again.
 *
 * Uploads get longer: half a megabyte on salon wifi is not a stall.
 */
var API_TIMEOUT = 20000, API_TIMEOUT_SLOW = 60000;
function api(name, payload){
  INFLIGHT++;
  var done = function(){ INFLIGHT = Math.max(0, INFLIGHT - 1); };
  var slow = /Photo|Shot|Upload/i.test(String(name));
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  var timer = null, bell = null;

  /* THE ABORT DOES NOT STOP THE SERVER, AND THAT IS THE WHOLE POINT.
     Apps Script runs a request to completion no matter what the browser does with the socket.
     So a timeout here never cancels a write — it only stops HER waiting. The write may well
     land after she has been told it did not. That is why the opId below is load-bearing
     rather than a nicety: it is the only thing that makes giving up safe.

     AND A RACE, NOT JUST AN ABORT. abort() needs AbortController; without it — an older phone
     — the old code set a timer that called nothing and the promise hung for ever. Racing the
     fetch against a rejecting timer gives every device a deadline, and the abort on top is
     what frees the socket where it exists. */
  var deadline = new Promise(function(_, reject){
    timer = setTimeout(function(){
      if (ctl) { try { ctl.abort(); } catch (e) {} }
      var err = new Error('timeout'); err.name = 'AbortError'; reject(err);
    }, slow ? API_TIMEOUT_SLOW : API_TIMEOUT);
  });
  var stop = function(){ if (timer) clearTimeout(timer); timer = null; };
  return Promise.race([deadline, fetch(BOOK, {
    method: 'POST',
    redirect: 'follow',
    signal: ctl ? ctl.signal : undefined,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ name: name, payload: payload || {} })
  })]).then(function(r){
    /* Stop the clock the moment the response lands, not when the body finishes reading —
       a large answer arriving slowly is not a stall. */
    stop();
    return r.text();
  }, function(e){
    stop(); throw e;
  }).then(function(t){
    done(); return t;
  }, function(e){
    done(); throw e;
  }).then(function(t){
    var out;
    /* Apps Script answers an unauthenticated or broken call with an HTML page, not JSON.
       Parsing that as data is how a dead endpoint looks like a mysterious app bug. */
    try { out = JSON.parse(t); }
    catch (e) { throw new Error('The book could not be reached. Tell the front desk.'); }
    if (out.error) throw new Error(out.error);
    return out;
  })['catch'](function(e){
    /* Named for what she should DO about it. 'AbortError' is not a sentence. */
    if (e && (e.name === 'AbortError' || /abort/i.test(String(e.message || ''))))
      throw new Error('That took too long. Press send again — it will not go twice.');
    /* The server refusing a duplicate is not a failure SHE has to fix — the desk already has
       it. Telling her it went wrong would invite the very retry the refusal just prevented. */
    if (e && /still sending/i.test(String(e.message || '')))
      throw new Error('Still sending — give it a moment. Nothing is lost.');
    if (e && e.message) throw e;
    throw new Error('No connection. Check the wifi and try again.');
  });
}

/* One id per press, so a retry of a request that already landed is answered from the server's
   memory instead of written a second time. */
var OP_N = 0;
function opId(kind){
  return (kind || 'op') + '-' + (S.key || 'x') + '-' + Date.now() + '-' + (++OP_N);
}

/* The token lives on the phone and nowhere else. localStorage rather than a cookie: it is
   never sent anywhere except in the calls above. */
function saveToken(t){ try{ localStorage.setItem('artonus_chair', t); }catch(e){} }
function loadToken(){ try{ return localStorage.getItem('artonus_chair')||''; }catch(e){ return ''; } }
function dropToken(){ try{ localStorage.removeItem('artonus_chair'); }catch(e){} }

/* ─────────────────────────── enrolment ─────────────────────────── */
function viewEnrol(){
  $('app').innerHTML = head('Technician access')
    + '<div class="card"><h3>Join with your code</h3>'
    + '<p class="lede">The front desk gives you a code. It works once, for this phone, '
    + 'and stops working after a day.</p>'
    + '<input class="in" id="code" type="text" inputmode="latin" autocapitalize="characters" '
    + 'autocomplete="off" maxlength="9" placeholder="8-character code" style="text-align:center;'
    + 'font-size:22px;letter-spacing:5px;font-weight:900">'
    + '<button class="btn" id="join">Use this phone</button></div>';
  $('code').oninput = function(){ this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g,''); };
  $('join').onclick = function(){
    var c = $('code').value.trim();
    if (c.length !== 8){ toast('The code is 8 characters.','err'); return; }
    var b=$('join'); b.disabled=true; b.textContent='Checking…';
    api('enrol', { code:c, agent:navigator.userAgent.slice(0,120) }).then(function(r){
      saveToken(r.token); S.token=r.token; S.tech=r.person; S.chair=r.chair;
      toast(' Signed in as '+r.person, null, ICON.check);
      loadDay();
    })['catch'](function(e){
      b.disabled=false; b.textContent='Use this phone'; toast(e.message,'err');
    });
  };
}

function head(sub){
  return '<div class="hdr"><img src="'+LOGO+'" alt="Artonus"><h1>My Day</h1>'
    + '<div class="sub">'+esc(sub)+'</div></div>'
    + (S.token ? '<nav class="anav"><span class="pill">'+ICON.person+esc(S.tech)
        + (S.chair?' · chair '+esc(S.chair):'')+'</span>'+bellHtml()+'</nav>' : '');
}
/* NO SIGN-OUT. The code that enrolled this phone was single-use and is already spent, so
   signing out would strand her mid-shift with a client in the chair. The desk revokes the
   device if she leaves; that is the correct place for it. */

function bellHtml(){
  var n = unseen().length;
  return '<span class="pill" onclick="openBell()">'+ICON.bell+'Alerts'
    + '<span class="dot bellcount"'+(n?'':' style="display:none"')+'>'+(n||'')+'</span></span>';
}

/* ─────────────────────────── her day ─────────────────────────── */
function loadDay(){
  var s = ++S.session;
  /* techPoll, not techToday: opening the app already needed her day, and asking for the
     feed in the same breath costs nothing extra and saves a whole round trip on open. */
  api('techPoll', { token:S.token, since:S.cursor }).then(function(r){
    if (S.session !== s) return;
    REFRESHING = false; pollTrouble(false);
    /* When this answer was taken, so the waiting clock on a receipt can keep running between
       polls without trusting this phone's own idea of what time it is. */
    S.pollAt = Date.now();
    S.tech=r.tech; S.chair=r.chair; S.visits=r.visits; S.help=r.help; S.caps=r.caps||[];
    applyHelpPending();      // the hand stays where she put it
    applyPending();
    if (r.vocab && r.vocab.length) S.vocab = r.vocab;
    S.changes = r.changes || [];
    /* quiet: whatever happened before she opened the app is history. It is all in the bell,
       and the count is on the badge; what it must not be is a modal over her first screen. */
    absorb(r, true);
    S.view='today'; render(); paintAlert(); refreshBell();
    poll();
  })['catch'](function(e){
    /* A dead token is the ordinary end of a device's life, not an error to shout about. */
    if (/not signed in/.test(e.message)){ dropToken(); S.token=''; S.view='enrol'; render(); return; }
    $('app').innerHTML = head('Your day')
      + '<div class="card"><h3>Could not load your day</h3><p class="lede">'+esc(e.message)+'</p>'
      + '<button class="btn" onclick="loadDay()">Try again</button></div>';
  });
}
/* FAIL CLOSED. This used to read `!S.caps.length ||`, so an empty capability list — a poll
   that had not returned yet, or one that failed — showed EVERY gated control. The server is
   the real gate and would have refused, but the phone should not offer a button it may not
   have. Empty is safe to treat as "no": capsList_() always returns the full list with the
   defaults applied, so empty can only mean "not loaded". */
function can(k){ return S.caps.some(function(c){ return c.key===k && c.on; }); }

/**
 * WHAT CHANGED TODAY — moves and cancellations, said out loud.
 *
 * A cancelled booking used to just disappear from her list on the next poll, and a moved one
 * silently re-timed. She would go looking for a client who was never coming, or stand ready
 * at two for someone shifted to half past three. Neither is a thing she can find out from a
 * list that quietly rearranged itself.
 */
function changesHtml(){
  var ch = S.changes || [];
  if (!ch.length) return '';
  return '<div class="changes">'
    + ch.map(function(c){
        var who = '<b>'+esc(c.name || 'A client')+'</b>';
        return '<div class="chg">' + (c.type === 'CANCELED'
          ? ICON.close + '<div>' + who + ' at ' + esc(c.was || '—') + ' <b>cancelled</b>'
            + (c.svc ? ' <span class="quiet">· '+esc(c.svc)+'</span>' : '') + '</div>'
          : ICON.clock + '<div>' + who + ' moved <span class="was">' + esc(c.was || '—')
            + '</span><span class="arrow">→</span><b>' + esc(c.now || '—') + '</b></div>')
          + '</div>';
      }).join('')
    + '</div>';
}

function viewToday(){
  var h = head('Today · '+esc(S.tech));
  h += changesHtml();
  if (!S.visits.length){
    h += '<div class="card"><h3>Nothing in your chair yet</h3>'
      + '<p class="lede">When the front desk books or walks someone in for you, they appear here.</p></div>';
  } else {
    /* Inside the else, not above the guard: "Booked at your chair · 0" over "Nothing in your
       chair yet" is two contradictory sentences. */
    h += '<div class="lbl">Booked at your chair · '+S.visits.length+'</div>';
    S.visits.forEach(function(v){
      var tag = v.state==='in service' ? '<span class="tag serv">in service</span>'
              : v.state==='almost done' ? '<span class="tag serv">almost done</span>'
              : v.state==='finished' ? '<span class="tag done">finished</span>'
              : '<span class="tag book">booked</span>';
      h += '<div class="visit" onclick="openVisit(\''+esc(v.key)+'\')">'
        + '<div class="t">'+esc(v.at||'')+'</div><div style="flex:1;min-width:0">'
        + '<div class="nm">'+esc(v.name)+'</div>'
        + '<div class="sv">'+esc(v.svc||'—')+(v.price?' · '+money(v.price):'')+'</div>'
        + tag + (v.walkin?' <span class="tag walk">walk-in</span>':'')
        + (v.moreTime?' <span class="tag book">+'+v.moreTime+' min</span>':'')
        /* She should know a design is waiting BEFORE she opens the card, so she can read it
           while the client is still walking over rather than after she has sat down. */
        /* Red, and before the design tag, because an allergy outranks a design brief.
           She can now tell an allergy client from any other client without opening the card. */
        + (v.mustKnows?' <span class="tag must">'+v.mustKnows+' must-know'+(v.mustKnows>1?'s':'')+'</span>':'')
        + (v.hasBrief?' <span class="tag want">'+ICON.star+'design</span>':'')
        + '</div></div>';
    });
  }
  h += dockHtml();
  $('app').innerHTML = h;
}

/**
 * Record that she has read a must-know.
 *
 * The button is disabled the instant it is pressed, before the request leaves: a second tap
 * while the first is in flight is the ordinary way a duplicate row gets written. The server
 * refuses a duplicate as well, so this is the belt and the braces.
 */
function ackFlag(id, btn){
  if (btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  api('techAck', { token: S.token, key: S.key, id: id })
    .then(function(){
      toast(' Thank you — that is written down.', null, ICON.check);
      openVisit(S.key);          /* re-reads the card, so the row flips to "You have read this" */
    })
    ['catch'](function(e){
      if (btn){ btn.disabled = false; btn.textContent = 'I read this'; }
      toast(e.message, 'err');
    });
}

/* ─────────────────────────── the visit ─────────────────────────── */
function openVisit(key){
  S.key = key;
  S.visit = S.visits.filter(function(v){ return v.key===key; })[0] || null;
  /* S.missing belongs to ONE visit. Left behind it would tell the next client's screen that
     her photographs were already taken. */
  S.card = null; S.thumbs = null; S.missing = null; PHOTO_UP = {}; S.view = 'visit';
  render();
  /* Her card is a second read on purpose: the day list must paint instantly, and the card is
     the expensive part. A walk-in with no number has no card at all, and says so. */
  if (S.visit && !S.visit.nameOnly){
    var s = ++S.session;
    api('techClient', { token:S.token, key:key }).then(function(c){
      if (S.session !== s || S.key !== key) return;
      S.card = c; S.missing = null; render(); loadThumbs();
    })['catch'](function(e){ S.cardErr = e.message; render(); });
  }
}
function viewVisit(){
  var v = S.visit;
  if (!v) { S.view='today'; return render(); }
  var h = head('Their card');
  h += '<button class="skip" onclick="S.view=\'today\';render()" style="margin-bottom:10px">'
     + ICON.back+' Today</button>';

  h += '<div class="card"><h3>'+esc(v.name)+'</h3>'
    + '<p class="lede">'+esc(v.at||'')+' · '+esc(v.svc||'—')
    + (v.price?' · '+money(v.price):'')+(v.walkin?' · walk-in':'')+'</p>'
    /* THE ADD-ONS, NAMED. The price at the end of that line already included them, so the
       screen was quoting a number it never explained — a technician reading "$166.25" for a
       Tier 1 manicure has no way to see that two of it is a nail patch. */
    + ((v.addons && v.addons.length)
        ? '<p class="lede" style="margin:2px 0 0">Plus <b>'
          + v.addons.map(function(a){ return esc(a.label || a.name); }).join('</b>, <b>')
          + '</b></p>'
        : '')
    + '</div>';

  h += cardHtml();

  if (v.state === 'booked'){
    h += '<div class="card"><h3>They are not in the chair yet</h3>'
      + '<p class="lede">Tap when they sit down. The front desk sees it straight away.</p>'
      + '<button class="btn" id="seat">They are in the chair</button></div>';
  } else {
    h += chairCard(v);
  }
  h += dockHtml();
  $('app').innerHTML = h;
  if ($('seat')) $('seat').onclick = function(){ sig('SEATED', {}, 'seat'); };
  wireChair(v);
  wireShots(document);
}

function chairCard(v){
  /* ══ ORDERED BY THE WORK, NOT BY THE FEATURE LIST ═══════════════════════════════════════
     Trung, 17 August: 'prioritize the information that the technician needs when she works,
     and the workflow that she has to go through, and the features that she will use most, I
     suspect the feature that she use the most is going to be the need more time.'

     He is right about the order and about which one wins. Three moments, and they are not
     equally long:

       AT THE SEAT     once, thirty seconds — read the card, take the before photo
       WHILE WORKING   the whole appointment — running over, an add-on, a raised hand
       BEFORE FINISH   once, at the end — the other photos, a note, a rating, rebooking

     The screen used to be in the order the features were built: all three photos first,
     including the two that cannot be taken yet, and the time buttons — the thing she reaches
     for with a client's hand in hers — below the fold.

     So: the before photo leads ONLY while it is missing, then gets out of the way. Time comes
     first for the rest of the visit. Everything that belongs to the end is under one heading
     at the end. */
  var h = '<div class="card"><h3>In the chair</h3>';
  var got = (S.card && S.card.photos) || {};
  var atTheSeat = !got['Before'];

  /* AT THE SEAT. The before photo is the only one that can be taken now, and it is the one
     the whole record depends on — there is no second chance at what the hands looked like
     when she sat down. */
  if (atTheSeat) h += photosHtml();

  /* WHILE WORKING — the most-used control, first, and never below the fold. */
  h += '<div class="lbl"' + (atTheSeat ? '' : ' style="margin-top:var(--s2)"') + '>Need more time?</div>'
    + (v.moreTime ? '<div class="note" style="margin-bottom:var(--s2)">'+ICON.check
        + ' The desk knows — you asked for <b>+'+v.moreTime+' min</b>. Send a new number to change it.</div>' : '')
    + '<div class="sigrow">'
    + [10,15,30].map(function(m){
        var on = Number(v.moreTime) === m;
        return '<button class="sigbtn'+(on?' sent':'')+'" data-mt="'+m+'">'
          + (on?ICON.check:ICON.clock)+'+'+m+' min</button>'; }).join('')
    + '</div>'
    + '<div class="row2"><input class="in mtnum" id="mtnum" type="text" inputmode="numeric" '
    + 'pattern="[0-9]*" placeholder="Or type the minutes" style="margin:0">'
    + '<button class="skip" id="mtgo">'+ICON.clock+' Send</button></div>';

  /* Derived from the visit, not stamped on the button — the poll re-renders a second later
     and a stamped tick died with it, which reads as "it did not send". */
  h += '<div class="lbl">Almost finished?</div><div class="sigrow">'
    + '<button class="sigbtn'+(v.almost?' sent':'')+'"'+(v.almost?' disabled':'')+' data-sig="ALMOST_DONE">'
    + (v.almost ? ICON.check+'Desk notified' : ICON.clock+'Tell the desk — almost done')
    + '</button></div>';

  /* What they are having, and changing it — reached when the client asks for something. */
  h += svcHtml(v);

  /* THE WAITING BAR IS GONE. Trung, 17 August: 'I think we should remove the still waiting on
     the front desk, it takes up space. And, not really useful.'

     He is right and the code says why: it listed everything ever sent for the visit and never
     dropped a line, so by the middle of an appointment it was four or five rows of which most
     read 'DONE · FRONT DESK'. A finished thing needs no row. It had become a log pretending to
     be a status, and it was sitting between her and the work.

     Each button already carries its own sent state, so nothing about what she has pressed is
     lost. What IS lost is the overdue alarm — the amber 'nobody has answered' after five
     minutes. That was the one part with a job, and it can come back on its own, as one line
     that appears only when something is genuinely unanswered and shows nothing otherwise. */

  /* ══ BEFORE YOU FINISH ══ one heading over everything that belongs to the end of a visit,
     so the middle of the screen is not carrying it all appointment long. */
  h += '<div class="endblk"><div class="endhd">Before you finish</div>';

  if (!atTheSeat) h += photosHtml();

  if (can('tech.serviceChange')){
    /* THE DESIGN TIER IS GONE from this screen, 17 August. The tier is already carried by
       the service she is booked for — 'Signature Gel Mani w/ Tier 1 + Removal' says it in
       the line above — so this was a second place to set the same fact, and two places to
       set one fact is how they end up disagreeing. TIER_CHANGE still exists on the server
       for anything already sent; nothing calls it from here. */

    var sentCamps = v.campaigns || [];
    h += '<div class="lbl">They are interested in</div><div class="sigrow">'
      + ['Rebooking discount','Referral cards'].map(function(n){
          var on = sentCamps.indexOf(n) >= 0;
          return '<button class="sigbtn'+(on?' sent':'')+'"'+(on?' disabled':'')+' data-camp="'+esc(n)+'">'
            + (on?ICON.check:ICON.star)+esc(n)+'</button>'; }).join('')
      + '</div>';
  }

  /* NO MUST-KNOW BUTTON HERE ANY MORE. Trung, 17 August: 'I want the must know to be in the
     rating, instead of being outside of it.' One moment of record, at the end, holding
     everything — the stars, the booking tip, the note, the photographs and the must-know. A
     button she could press at any point in the afternoon was a second commit moment
     pretending not to be one. */

  if (v.state === 'finished'){
    h += (S.card && S.card.rated)
      ? '<div class="lbl">Your rating</div><p class="lede" style="margin:0">'
        + 'Saved: <span class="stars">'+'★★★★★'.slice(0,S.card.rated.stars)+'</span></p>'
      : '<button class="btn" style="margin-top:var(--s3)" onclick="openRating()">'+ICON.star+'Rate the visit</button>';
  } else {
    /* Straight from the server, so the button and the refusal cannot disagree. It says what
       is outstanding rather than sitting dead with no explanation. */
    var short = missingBits();
    h += '<button class="btn" id="finish" style="margin-top:var(--s3)"'+(short.length?' disabled':'')+'>'
      + (short.length ? 'Still needed: ' + short.join(', ') : 'They are finished') + '</button>';
  }
  return h + '</div></div>';
}

/* How far back the average reaches, said the way a person says it. The number comes from the
   server, which is the thing that applies the window — the page does not get to have its own
   opinion about how far back "recently" goes. */
function windowWords(days){
  var d = Number(days) || 365;
  if (d <= 45)  return 'in the last month';
  if (d <= 200) return 'in the last ' + Math.round(d / 30) + ' months';
  var y = Math.round(d / 365);
  return y <= 1 ? 'in the last year' : 'in the last ' + y + ' years';
}

/* WHAT WE KNOW ABOUT HER. She reads all of it — a technician who cannot see the allergy is
   the reason this book exists. */
function cardHtml(){
  var v = S.visit;
  if (v.nameOnly) return '';
  var c = S.card;
  if (!c) return '<div class="card"><p class="lede">'
    + (S.cardErr ? esc(S.cardErr) : 'Opening their card&hellip;') + '</p></div>';

  var h = '';
  /* WHAT SHE ASKED FOR, first. The alert says this is "on her card" and until now it was
     not — a technician who dismissed the pop-up mid-service had no second way to read it.
     Above the flags on purpose: the flags say how to treat her, this says what to make. */
  if (c.brief && (c.brief.text || c.brief.photos)){
    /* THE PICTURE SHE IS BEING ASKED TO COPY, instead of a count of pictures she cannot see.
       This line used to say "· 2 photos" while the desk decoded the image and threw it away,
       so she went looking for something that had never been stored anywhere. The bytes now go
       to My Day, which holds the Drive permission, and arrive here exactly the way her own
       Before/After photos do. */
    var dshot = (S.thumbs||{}).Design, dhas = !!(((S.card||{}).photos)||{}).Design;
    h += '<div class="brief">'+ICON.star+'<div><b>The design they want</b><br>'
      + (c.brief.text ? esc(c.brief.text)
                      : '<span class="quiet">No words — they showed a picture.</span>')
      + (dshot
          ? '<button class="briefshot" data-open="Design" style="background-image:url('+dshot+')">'
            + '<span class="cap">Tap to see it big</span></button>'
          : dhas
            ? '<div class="note by" style="background:none;border:0;padding:6px 0 0;margin:0">Opening the picture&hellip;</div>'
            : '')
      + '<div class="note by" style="background:none;border:0;padding:4px 0 0;margin:0">'
      + esc(c.brief.by||'Front desk')+(c.brief.when?' · '+esc(c.brief.when):'')
      + '</div></div></div>';
  }
  if (c.tally)
    h += '<div class="card" style="padding:12px 15px"><div class="stars">'
      + '★★★★★'.slice(0, c.tally.avg >= 4.5 ? 5 : Math.round(c.tally.avg))
      /* The window comes from the SERVER, which is the thing that applies it. This line used
         to read "past year" as a fixed string while the server averaged every rating she had
         ever been given — words promising something the number did not do. */
      + '</div><b style="font-size:19px">'+c.tally.avg+'</b> '
      + '<span class="quiet">· '+c.tally.n+' rated visit'+(c.tally.n===1?'':'s')
      + ', '+windowWords(c.tally.days)+'</span></div>';

  (c.flags||[]).forEach(function(f){
    /* SHE CONFIRMS SHE READ IT. Until now a must-know was something to look at and nothing
       recorded that anyone had. The desk could already see who had read what — the phone
       simply never wrote a row. A read one goes quiet so the unread ones are the loud ones. */
    var read = f.readByMe;
    var loud = String(f.cls || '').toLowerCase() === 'allergy';
    h += '<div class="flag'+(read && !loud ? ' flag--read' : '')+(loud ? ' flag--allergy' : '')
      + '"><div class="k">'+esc(f.cls)+'</div><div class="body">'+esc(f.text)+'</div>'
      + '<div class="note by" style="background:none;border:0;padding:4px 0 0;margin:0">'
      + esc(f.author)+' · '+esc(f.when)
      + ((f.readBy||[]).length ? ' · read by '+esc(f.readBy.join(', ')) : '')
      + '</div>'
      + (read ? '<div class="ackdone">You have read this</div>'
              : '<button class="btn btn--ack" onclick="ackFlag(\''+esc(f.id)+'\',this)">I read this</button>')
      + '</div>';
  });

  /* MISLABELLED SINCE IT WAS WRITTEN. These are the standing chips — how she likes to be
     worked on — and the heading said Must-knows, which is the red cards above. So a client
     with no standing chips showed an empty box titled Must-knows directly under a real
     must-know, which reads as one going missing. */
  h += '<div class="card"><h3>Stays on their card</h3><div class="chips">'
    + ((c.standing||[]).length ? c.standing.map(function(t){ return '<span class="c">'+esc(t)+'</span>'; }).join('')
       : '<span class="quiet">Nothing yet.</span>')
    + '</div>';

  var vis = (c.visits||[]).slice(0,4);
  h += '<div class="lbl">Notes · everyone’s</div>'
    + (vis.length ? vis.map(function(n){
        return '<div class="note"><div class="by">'+esc(n.author)+' · '+esc(n.when)
          + (n.stars?' · <span class="stars">'+'★★★★★'.slice(0,n.stars)+'</span>':'')+'</div>'
          + (n.chips.length?'<div class="chips">'+n.chips.map(function(t){ return '<span class="c">'+esc(t)+'</span>'; }).join('')+'</div>':'')
          + (n.text?esc(n.text):'')
          /* THE PHOTOS FROM THAT VISIT. This is what a colour name cannot do: five weeks
             later the shade may be discontinued, renamed, or simply written down wrong, and
             the picture is still exactly right. Blank tiles first, filled as they arrive. */
          + '<div class="nshots">'
          + (n.tips ? '<div class="tip">'+ICON.clock+'<span>'+esc(n.tips)+'</span></div>' : '')
          + (n.shots||[]).concat(SHOT_PEND[n.id]||[]).map(function(id){
              return '<img class="'+(SHOT_CACHE[id]?'':'wait')+'" data-shot="'+esc(id)
                   + '" alt="from that visit" src="'+(SHOT_CACHE[id]||SHOT_BLANK)+'">'; }).join('')
          + '<button class="nshot-add" data-addshot="'+esc(n.id)+'">+ Photo</button>'
          + '</div>'
          + '</div>'; }).join('')
      : '<p class="lede">No notes yet — you would be the first.</p>');
  return h + '</div>';
}

/* THE THREE PHOTOS THAT ARE NOT OPTIONAL. Before proves what she walked in with; After and
   Color are what the next technician needs when she comes back in five weeks. */
var REQ = ['Before','After','Color'];

/* THE KEYBOARD COVERS THE BOX IT JUST OPENED.
   iOS scrolls a focused field into view on its own; Android Chrome does it only sometimes,
   and least reliably in exactly the case that matters — a text box near the bottom of a long
   card. One beat after the keyboard settles, put the field back on screen. */
document.addEventListener('focusin', function(e){
  var el = e.target;
  if (!el || !/^(INPUT|TEXTAREA)$/.test(el.tagName)) return;
  setTimeout(function(){
    try { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (err) {}
  }, 300);
});

/* ══ THE PHOTOS ON HER PAST NOTES ══════════════════════════════════════════════════════════
   Same record the front desk sees, from the same store. Kept for as long as this page is
   open: her card is rebuilt on every poll and re-fetching a photograph each time would be
   a second of waiting, over and over, for bytes that have not changed. */
var SHOT_BLANK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"></svg>');
var SHOT_CACHE = {}, SHOT_BUSY = {}, SHOT_PEND = {}, SHOT_N = 0;

function wireShots(root){
  Array.prototype.forEach.call(root.querySelectorAll('[data-shot]'), function(img){
    var id = img.getAttribute('data-shot');
    if (SHOT_CACHE[id]) { img.src = SHOT_CACHE[id]; img.className = ''; }
    else if (id.indexOf('pending:') === 0) { /* its own handler is filling it in */ }
    else if (!SHOT_BUSY[id]) {
      SHOT_BUSY[id] = true;
      api('techShot', { token: S.token, id: id }).then(function(r){
        SHOT_BUSY[id] = false;
        if (!r || !r.data) return;
        SHOT_CACHE[id] = r.data;
        Array.prototype.forEach.call(document.querySelectorAll('[data-shot="'+id+'"]'),
          function(t){ t.src = r.data; t.className = ''; });
      })['catch'](function(){ SHOT_BUSY[id] = false; });
    }
    img.onclick = function(){
      if (!SHOT_CACHE[id]) return;
      $('veil').className = 'veil on';
      $('veil').innerHTML = '<div class="alert" style="max-width:none;width:100%;background:none;'
        + 'box-shadow:none;padding:0;text-align:center">'
        + '<img src="'+SHOT_CACHE[id]+'" alt="from that visit" style="max-width:100%;max-height:70vh;'
        + 'border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5)">'
        + '<button class="btn" style="margin-top:14px" onclick="shutVeil()">Close</button></div>';
    };
  });
  Array.prototype.forEach.call(root.querySelectorAll('[data-addshot]'), function(b){
    b.onclick = function(){
      var noteId = b.getAttribute('data-addshot');
      var i = document.createElement('input');
      i.type = 'file'; i.accept = 'image/*'; i.capture = 'environment';
      i.onchange = function(){
        var f = i.files && i.files[0]; if (!f) return;
        b.disabled = true; b.textContent = 'Adding…';
        shrink(f, function(dataUrl){
          /* It goes up on her screen NOW, dimmed, while the bytes travel. Waiting for the
             round trip and then rebuilding the whole card meant several seconds of nothing
             followed by everything moving at once, which reads as a failure. */
          var tmp = 'pending:' + (++SHOT_N);
          SHOT_CACHE[tmp] = dataUrl;
          SHOT_PEND[noteId] = (SHOT_PEND[noteId] || []).concat([tmp]);
          var tile = document.createElement('img');
          tile.src = dataUrl; tile.className = 'sending';
          tile.setAttribute('data-shot', tmp); tile.alt = 'going up now';
          b.parentNode.insertBefore(tile, b);
          b.disabled = false; b.textContent = '+ Photo';

          api('techNoteShot', { token: S.token, noteId: noteId, data: dataUrl })
            .then(function(r){
              if (r && r.id){ SHOT_CACHE[r.id] = dataUrl; tile.setAttribute('data-shot', r.id); }
              tile.className = '';
              SHOT_PEND[noteId] = (SHOT_PEND[noteId] || []).filter(function(x){ return x !== tmp; });
              /* Her card is rebuilt by the next poll on its own; the photo is already there. */
              if (S.card){
                var n2 = (S.card.visits || []).filter(function(x){ return x.id === noteId; })[0];
                if (n2 && r && r.id) n2.shots = (n2.shots || []).concat([r.id]);
              }
            })['catch'](function(e){
              tile.remove();
              SHOT_PEND[noteId] = (SHOT_PEND[noteId] || []).filter(function(x){ return x !== tmp; });
              toast(String(e && e.message || e));
            });
        });
      };
      i.click();
    };
  });
}

/* What is still outstanding before this visit can be closed.
 *
 * TAKEN FROM THE SERVER, not worked out again here. This used to be a second copy of
 * finishBlockers_ with a comment promising it matched "word for word" — and the day the rule
 * changed it did not, which is what a promise in a comment is worth. The server ships the
 * list on the card; the button prints it.
 *
 * A card that has not arrived yet is not the same as a visit with nothing outstanding, so it
 * says so rather than offering a button that would be refused. */
function missingBits(){
  /* The freshest answer wins: a photograph just uploaded knows more than the card that was
     fetched when the visit opened. */
  if (S.missing) return S.missing;
  if (S.card) return S.card.missing || [];
  /* A WALK-IN WITH NO NUMBER HAS NO CARD, and openVisit deliberately does not fetch one — so
     this used to read 'Still needed: their card to open' with no way out of it from this
     screen at all. What is actually outstanding is the photographs, and she can take those. */
  var got = (S.card && S.card.photos) || {};
  return REQ.filter(function(l){ return !got[l] && !PHOTO_UP[l]; })
            .map(function(l){ return 'the ' + l.toLowerCase() + ' photo'; });
}

/* Repaint the finish button alone, for the same reason paintPhotos exists: a full render
   throws away a tile whose photograph is still travelling. */
function paintFinish(){
  var b = $('finish');
  if (!b) { return; }
  var short = missingBits();
  b.disabled = !!short.length;
  b.textContent = short.length ? 'Still needed: ' + short.join(', ') : 'They are finished';
}

/**
 * WHAT THE DESK ALREADY HAS — AND WHAT IT HAS ACTUALLY DONE.
 *
 * This bar used to say "Sent to the front desk" and list the things. Sent is not the thing
 * she needs to know. If she asks for fifteen more minutes and nobody at the desk moves the
 * schedule, her next client is already sitting in the waiting area and she is the last
 * person in the building to find out. "Sent" told her nothing about that.
 *
 * So each line now carries the desk's own answer against it:
 *   WAITING 3 MIN — nobody has touched it. The clock keeps running, and past five minutes it
 *                   turns red, which is her cue to walk over rather than wait longer.
 *   ROSA HAS IT   — somebody at the desk read it.
 *   DONE · ROSA   — somebody at the desk did it. The only answer that ends the question.
 *
 * "She is in the chair" and "almost finished" never need doing, so being read is the whole
 * receipt for those and they never go red.
 */
/* HOW LONG SHE HAS BEEN WAITING — but only once that is worth saying.
 *
 * The first version said "Waiting" the instant she pressed. Trung, immediately: "it still
 * makes it look like the feature didn't work." He is right. She pressed the button, the
 * button worked, and the screen answered by telling her she was waiting for somebody. Being
 * technically accurate about the desk not having replied yet is not worth making a working
 * feature look broken.
 *
 * So: pressing always reads as DONE. The nagging starts only after the desk has genuinely had
 * time and not used it. */
/* THE COLOUR TEXT IS GONE. Trung, 16 August: 'remove the section on the technician side
   where I have to enter the color, its pointless because we have the photo.'

   He is right, and the field had already lost its last job: it stopped blocking the close-out
   on 15 August because a technician told she cannot finish until she types a shade number
   types anything, and a field full of guesses is worse than an empty one. What is left is the
   photograph, which cannot be guessed and cannot go out of date. techColor still exists on
   the server for anything that already recorded a shade; nothing calls it from here.
*/

/* ── CHANGING THE SERVICE, FROM THE CHAIR ───────────────────────────────────
   The permission existed and there was nothing behind it. Searchable, like the desk's, and
   the price comes from the server's copy of the menu — never from this screen. */
function svcHtml(v){
  if (!can('tech.serviceChange')) return '';
  return '<div class="lbl">What they are having</div>'
    + '<div class="note" style="margin-bottom:var(--s2)"><b>'+esc(v.svc||'—')+'</b>'
    + (v.price?' · '+money(v.price):'')
    + ((v.addons&&v.addons.length)
        ? '<br><span class="quiet">'+v.addons.map(function(a){ return esc(a.label||a.name); }).join(' · ')+'</span>'
        : '')
    + '</div><div class="sigrow">'
    + '<button class="sigbtn" onclick="openSvc()">'+ICON.plus+'Change the service</button>'
    + '<button class="sigbtn" onclick="openAddon()">'+ICON.plus+'Add an add-on</button></div>';
}
var MENU = null;
function withMenu(then){
  if (MENU) return then(MENU);
  api('menu', { token:S.token }).then(function(r){ MENU = r; then(r); })
    ['catch'](function(e){ toast(e.message,'err'); });
}
/* ══ PICK, THEN SEND ═══════════════════════════════════════════════════════════════════════
   Trung, 17 August: 'the change the service and the add an add-on sends automatically send
   when I click on a chip, but I want it to be an option to select then the send is manual.'

   Tapping a name used to BE the send — one mis-tap and the desk had a service change she did
   not mean, and correcting it meant a second signal explaining the first. The desk's ticket
   sheet learned this a day earlier: choose everything, look at it, then send once.

   Both sheets keep the same shape now — a chosen row, a Send button that names what it is
   about to do, and Cancel meaning cancel. */
var SVC_OP = '';
function openSvc(){
  var picked = '';
  var GEN = ++SHEET_GEN;                            // see openAddon
  var mine = function(){ return GEN === SHEET_GEN; };
  var sending = false;                              // see openAddon — a repaint must not unlock
  SVC_OP = '';
  $('veil').className = 'veil on';
  $('veil').innerHTML = '<div class="alert"><h3>Change the service</h3>'
    + '<input class="in" id="svcq" placeholder="Start typing&hellip;" autocomplete="off">'

/* DOWNSCALED IN THE BROWSER, ALWAYS — but this is the salon's color record, so the
   settings are chosen for that and not just for the wire.

   1600px on the long edge at quality 0.88. A 12MP phone photo is 3–6MB and would not fit
   through Apps Script at all; 1200/0.82 fit comfortably but lost the free-edge line and put
   visible blocking into saturated reds and chrome, which are precisely the colors anyone
   opens these photos to check. 1600/0.88 is roughly double the bytes — a few hundred KB —
   and holds glitter and chrome texture. Well inside the 3MB the server accepts.

   TWO THINGS THAT ARE EASY TO GET WRONG AND VERY VISIBLE:
   · ORIENTATION. A phone camera writes the rotation into EXIF rather than into the pixels.
     Drawing straight to a canvas throws that away, and every portrait photo lands sideways.
     createImageBitmap with imageOrientation:'from-image' applies it; the <img> fallback is
     for browsers that lack it, where the tag is honoured anyway.
   · SMOOTHING. Reducing 4032px to 1600px in one step aliases badly on fine detail — the
     exact texture we are keeping the photo for. imageSmoothingQuality:'high' costs nothing. */
/* ══ MEASURED, NOT GUESSED ══════════════════════════════════════════════════════════════
   Trung, 17 August: 'the upload speed of the photos is too slow.'

   A 3024x4032 phone photograph came out of here as a 984 KB data URL — and she takes THREE
   in a row, so a visit posted about 3 MB up a salon's uplink before the app could tell her
   anything had happened. Every other cost in the path (Google's ~0.85s dispatch, the Drive
   write, the sheet append) is fixed; the bytes were the only part we chose.

   1280px at q0.76 measures 472 KB on the same source image — 52% less, 1.4 MB for a whole
   visit instead of 3 MB. At 960x1280 it still covers 82% of a 3x phone screen full-bleed,

function shrink(file, done){

    else if (h >= w && h > PHOTO_MAX){ w = Math.round(w * PHOTO_MAX / h); h = PHOTO_MAX; }

function viaImg(file, paint){

    img.src = r.result;

                + esc(w)+'</button>'; }).join('')+'</div>' : '')
      /* ══ TWO BOXES, TWO QUESTIONS ══════════════════════════════════════════════════════
         Trung, 17 August: 'replace the chips to a text box, and that section will be Booking
         tips. The lower section will be the note section.'

      + '<div class="lbl">Booking tips</div>'

      + '<div class="row2"><button class="skip" style="flex:1" onclick="shutVeil()">Not now</button>'

    Array.prototype.forEach.call(document.querySelectorAll('[data-star]'), function(b){
