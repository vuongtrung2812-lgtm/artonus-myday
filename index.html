function saveCompose(){
  var b = $('csave'); b.disabled = true; b.innerHTML = 'Saving…';
  var txt = ($('ctext')||{value:''}).value, chips = Object.keys(COMP.picked);
  var mk = COMP.kind==='mk';
  api(mk?'techMustKnow':'techNote',
      { token:S.token, key:S.key, chips:chips, text:txt,
        /* cls was never sent, so a technician could not raise an allergy — every must-know
           she wrote arrived as "other" and never showed in red at the top of the card. */
        cls: mk ? (COMP.cls || 'other') : '',
        opId: (mk?'mk-':'nt-') + S.key + '-' + Date.now() }).then(function(){
    shutVeil(); toast(' Saved to her card.', null, ICON.check);
    return api('techClient', { token:S.token, key:S.key });
  }).then(function(c){ if (c) S.card = c; render(); })
  ['catch'](function(e){ b.disabled=false; b.innerHTML = mk?'Save must-know':'Save note'; toast(e.message,'err'); });
}

/* ── THE RATING — of the VISIT, never of the woman ──────────────────────────
 *
 * The demo's governing line is "Rate this visit — never the person," and the build had
 * replaced it with "Only the team ever sees this. She never does." That is not the same
 * promise; it is permission. The reasons had drifted with it: 'Hard to work with' and
 * 'Changed her mind' judge a person, and they are written to a spreadsheet row keyed to a
 * named woman's phone number, where they outlive everyone's memory of the day.
 *
 * These reasons describe what HAPPENED, which is the only thing the next technician can act
 * on. And the booking chips below are the point of the whole screen: a star with no
 * instruction is a grudge, a star with "book extra time" is a salon that runs better.
 */
var WHY = ['Ran past booked time', 'Changed design mid-service', 'Asked for redo',
           'Arrived late', 'Damage to repair'];
var WRAP = [['Book as usual', 'check'], ['Book extra time', 'clock'],
            ['Check with her before booking', 'hand']];

function openRating(){
  var stars = 0, why = {}, wrap = {};

  function hint(){
    if (!stars) return 'Rate this visit — never the person.';
    return stars >= 4 ? 'Good visit — pick the booking note and save.'
                      : 'Say what happened, so the next person can act on it.';
  }
  function ready(){
    var needWhy = stars > 0 && stars <= 3;
    var told = Object.keys(wrap).length || (($('rnote') || { value: '' }).value.trim().length > 0);
    return stars > 0 && told && (!needWhy || Object.keys(why).length > 0);
  }

  function paint(){
    $('veil').innerHTML = '<div class="alert"><h3>How was the visit?</h3>'
      + '<div class="sigrow" style="justify-content:center;margin:8px 0 2px">'
      + [1,2,3,4,5].map(function(n){
          return '<button class="rchip'+(n<=stars?' on':'')+'" data-star="'+n+'" '
            + 'style="min-width:52px;min-height:52px;justify-content:center;font-size:20px">'
            + (n<=stars?'★':'☆')+'</button>'; }).join('')+'</div>'
      + '<p class="hint" style="text-align:center;margin:0 0 10px">'+esc(hint())+'</p>'
      + (stars && stars<=3
          ? '<div class="lbl">What made it that way? — pick at least one</div><div class="sigrow">'
            + WHY.map(function(w){ return '<button class="rchip'+(why[w]?' on':'')+'" data-why="'+esc(w)+'">'
                + esc(w)+'</button>'; }).join('')+'</div>' : '')
      + '<div class="lbl">For the front desk — pick all that apply</div><div class="sigrow">'
      + WRAP.map(function(w){ return '<button class="rchip'+(wrap[w[0]]?' on':'')+'" data-wrap="'+esc(w[0])+'">'
          + (ICON[w[1]]||'')+esc(w[0])+'</button>'; }).join('')+'</div>'
      + '<div class="lbl">Your booking tip — optional</div>'
      + '<textarea class="ta" id="rnote" rows="2" placeholder="e.g. Book her with Chelsea next time."></textarea>'
      + '<div class="row2"><button class="skip" style="flex:1" onclick="shutVeil()">Not now</button>'
      + '<button class="btn" id="rsave" style="flex:1"'+(ready()?'':' disabled')+'>Save rating</button></div></div>';

    Array.prototype.forEach.call(document.querySelectorAll('[data-star]'), function(b){
      b.onclick = function(){ stars = Number(b.getAttribute('data-star')); why = {}; paint(); };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-why]'), function(b){
      b.onclick = function(){ var w=b.getAttribute('data-why');
        if (why[w]) delete why[w]; else why[w]=true; paint(); };
    });
    /* "Book as usual" is exclusive: it cannot be true at the same time as "book extra time"
       or "check with her first", and a desk reading both would not know which to believe. */
    Array.prototype.forEach.call(document.querySelectorAll('[data-wrap]'), function(b){
      b.onclick = function(){
        var w = b.getAttribute('data-wrap');
        if (wrap[w]) { delete wrap[w]; }
        else if (w === 'Book as usual') { wrap = {}; wrap[w] = true; }
        else { delete wrap['Book as usual']; wrap[w] = true; }
        paint();
      };
    });
    if ($('rnote')) $('rnote').oninput = function(){
      var b = $('rsave'); if (b) b.disabled = !ready();
    };
    if ($('rsave')) $('rsave').onclick = function(){
      var btn=$('rsave'); btn.disabled=true; btn.innerHTML='Saving…';
      /* The booking instruction rides with the reasons — it is the half the desk acts on. */
      var chips = Object.keys(why).concat(Object.keys(wrap));
      api('techRating', { token:S.token, key:S.key, stars:stars,
                          why:chips, note:($('rnote')||{value:''}).value }).then(function(){
        shutVeil(); toast(' Saved. Thank you.', null, ICON.check);
        /* Re-pull the card, not just the day: without this her own rating is invisible until
           she leaves the screen and comes back, which reads as "it did not save". */
        api('techClient', { token:S.token, key:S.key }).then(function(c){ S.card = c; render(); })
          ['catch'](function(){ refresh(); });
      })['catch'](function(e){ btn.disabled=false; btn.innerHTML='Save rating'; toast(e.message,'err'); });
    };
  }
  $('veil').className='veil on';
  paint();
}

function wireChair(v){
  Array.prototype.forEach.call(document.querySelectorAll('[data-mt]'), function(b){
    b.onclick = function(){ sig('MORE_TIME', { mins:Number(b.getAttribute('data-mt')) }, b); };
  });
  function sendTyped(){
    var n = Number(($('mtnum').value||'').replace(/\D/g,''));
    if (!(n>=5 && n<=120)){ toast('Between 5 and 120 minutes.','err'); return; }
    sig('MORE_TIME', { mins:n }, $('mtgo'));
  }
  if ($('mtgo')) $('mtgo').onclick = sendTyped;
  /* Enter sends. She has one dry hand and the button is the width of a thumb away. */
  if ($('mtnum')) $('mtnum').onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); sendTyped(); } };
  Array.prototype.forEach.call(document.querySelectorAll('[data-sig]'), function(b){
    b.onclick = function(){ sig(b.getAttribute('data-sig'), {}, b); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-camp]'), function(b){
    b.onclick = function(){ sig('CAMPAIGN_INTEREST', { name:b.getAttribute('data-camp') }, b); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'), function(b){
    b.onclick = function(){ sig('TIER_CHANGE', { to:b.getAttribute('data-tier') }, b); };
  });
  if ($('finish')) $('finish').onclick = function(){ sig('FINISHED', {}, $('finish')); };
  wirePhotos();
}

/* One lock across the whole round trip. Without it a second tap while the first is in the
   air sends the same thing twice, and the desk sees a request nobody made. */
/* ══════════════════ WHY THE SCREEN MOVES BEFORE THE SERVER ANSWERS ══════════════════
 *
 * MEASURED, 2026-08-16. Trung: "after it said that the message is sent there is still a delay
 * as to when the result actually happens."
 *
 * He was watching three round trips, not one. sig() sent the signal (about a second), then
 * called refresh() — a whole techPoll — and then techClient on top of it. The word "Sent"
 * appeared after the first and her screen changed after the third.
 *
 * Now the screen changes on the PRESS. What she asked for is what she sees, immediately, and
 * the request goes in the background.
 *
 * THIS IS A PREVIEW, NEVER A RECORD. The ledger on the server is the only truth, every poll
 * overwrites what is drawn here, and a refusal puts the screen back exactly as it was and
 * says why. That matters with several chairs working at once: if the desk changed the ticket
 * a second before she pressed, the next poll corrects her screen rather than her preview
 * standing as fact. The rule is: this file may GUESS, it may never DECIDE.
 */
var PREVIEW_STATE = { SEATED:'in service', ALMOST_DONE:'almost done', FINISHED:'finished' };
function previewLabel(kind, p){
  switch (kind){
    case 'MORE_TIME':         return '+' + (Number(p.mins) || 0) + ' minutes';
    case 'SVC_CHANGE':        return 'Changed to ' + String(p.to || '');
    case 'ADDON':             return String(p.label || p.name || 'Add-on');
    case 'TIER_CHANGE':       return 'Design ' + String(p.to || '');
    case 'CAMPAIGN_INTEREST': return String(p.name || '');
    case 'SEATED':            return 'She is in the chair';
    case 'ALMOST_DONE':       return 'Almost finished';
    case 'FINISHED':          return 'Finished';
  }
  return '';
}
/** Draw what she just asked for. Returns the function that puts it back. */
function preview(kind, payload){
  var v = S.visit;
  if (!v) return function(){};
  var before = { moreTime: v.moreTime, tier: v.tier, state: v.state,
                 addons: (v.addons || []).slice(), campaigns: (v.campaigns || []).slice(),
                 sent: (v.sent || []).slice() };
  var p = payload || {};
  if (kind === 'MORE_TIME')   v.moreTime = Number(p.mins) || 0;       // SET, never stack
  if (kind === 'TIER_CHANGE') v.tier = p.to || v.tier;
  if (kind === 'ADDON')       v.addons = (v.addons || []).concat(
                                [{ name: p.name, label: p.label || p.name, price: 0 }]);
  if (kind === 'CAMPAIGN_INTEREST' && p.name && (v.campaigns || []).indexOf(p.name) < 0)
    v.campaigns = (v.campaigns || []).concat([p.name]);
  if (PREVIEW_STATE[kind]) v.state = PREVIEW_STATE[kind];
  /* A line in the receipt bar the moment she presses, so "waiting on the front desk" starts
     counting from when she asked rather than from when the server got round to saying so. */
  v.sent = (v.sent || []).concat([{ id: 'pending', kind: kind, label: previewLabel(kind, p),
                                    needsDone: true, waitedSec: 0, ack: null }]);
  render();
  return function undo(){
    v.moreTime = before.moreTime; v.tier = before.tier; v.state = before.state;
    v.addons = before.addons; v.campaigns = before.campaigns; v.sent = before.sent;
    render();
  };
}

function sig(kind, payload, btn){
  if (S.busy) return;
  S.busy = true;
  var el = (typeof btn === 'string') ? $(btn) : btn;
  var was = el && el.innerHTML;
  if (el){ el.disabled = true; el.innerHTML = ICON.check + ' Sent'; el.className =
             (el.className || '').replace(' sent','') + ' sent'; }
  var undo = preview(kind, payload);
  api('signal', { token:S.token, key:S.key, kind:kind, payload:payload }).then(function(){
    S.busy = false;
    if (el) el.disabled = false;
    /* NO refresh() here on purpose. The two calls that used to run at this point are what he
       was waiting through, and neither told him anything the preview has not already drawn.
       pollHot leans the ordinary poll in, so the server's own version lands a moment later
       and quietly replaces the guess. */
    pollHot();
  })['catch'](function(e){
    S.busy = false;
    undo();
    if (el){ el.disabled=false; el.innerHTML = was;
             el.className = (el.className || '').replace(' sent',''); }
    toast(e.message,'err');
  });
}

/* ─────────────────────────── help ─────────────────────────── */
function mmss(ms){ var s=Math.max(0,Math.round(ms/1000));
  return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2); }
/**
 * THE CLOCK ON A HELP REQUEST.
 *
 * MEASURED, 2026-08-15: it read 0:00 and stayed at 0:00 on both screens while a technician
 * stood waiting.
 *
 * The old stampMs took the ledger's `when` and did Date.parse(s.replace(' ','T')). On a
 * fresh read that value is a Date, and String(aDate) is "Sat Aug 15 2026 11:26:00 GMT-0400"
 * — replacing the first space makes "SatTAug 15 ...", Date.parse returns NaN, and the
 * fallback was Date.now(). So the age was always now minus now: zero, for ever.
 *
 * A FALLBACK THAT LOOKS LIKE SUCCESS IS THE WORST KIND. Falling back to "now" made a broken
 * clock read as a request that had just been made, which is exactly the number nobody
 * questions. The server now sends milliseconds; 0 means unknown and the clock stays blank
 * rather than lying about it.
 */
function helpMs(ms){ var t = Number(ms) || 0; return t || Date.now(); }

function dockHtml(){
  if (!can('tech.help')) return '';
  var h = S.help;
  if (!h) return '<div class="dock"><button class="helpbtn" onclick="askHelp()">'
    + ICON.hand+'Ask the front desk for help</button></div>';
  if (h.ack)
    return '<div class="dock"><div class="hstate coming"><div class="r">'+ICON.check
      + '<b>'+esc(h.ack.by)+' is coming</b><span class="t2">'+mmss(Date.now()-helpMs(h.ack.atMs))+'</span></div>'
      + '<button onclick="clearHelp()">All good — close it</button></div></div>';
  var age = Date.now()-helpMs(h.atMs);
  return '<div class="dock"><div class="hstate wait"><div class="r">'+ICON.hand
    + '<b>Waiting for the front desk</b><span class="t2">'+mmss(age)+'</span></div>'
    /* She chose the reason before this existed, so it is here from the first second. The row
       of chips that used to live down here — a request already sent, still asking what for —
       is gone. "Change what you need" is for the case where the answer turns out to be
       something else. */
    + (h.reason
        ? '<div style="margin-top:5px;opacity:.93">'+esc(h.reason)+'</div>'
          + '<button onclick="helpWhy()">Change what you need</button>'
        : '<button onclick="helpWhy()">Say what you need</button>')
    + '<button onclick="clearHelp()">'+(age<10000?'Never mind':'No longer needed')+'</button></div></div>';
}
/* HER SCREEN STAYS AWAKE WHILE SHE IS WAITING.
 * A phone propped against the station locks after thirty seconds, and then the answer —
 * "someone is coming" — arrives on a black screen she has to pick up and unlock to see,
 * with her hands wet. The lock is held only while a request is open, so the cost is bounded
 * by the request, and the tap that raises the hand is the user gesture the API requires. */
var WAKE = null;
function keepAwake(on){
  try {
    if (on && navigator.wakeLock && !WAKE)
      navigator.wakeLock.request('screen').then(function(w){ WAKE = w; })['catch'](function(){});
    if (!on && WAKE){ WAKE.release(); WAKE = null; }
  } catch (e) {}
}
/* A wake lock is dropped by the browser whenever the page is hidden, so it has to be
   re-taken on return or it silently stops working after the first glance away. */
document.addEventListener('visibilitychange', function(){
  if (!document.hidden && S.help && !S.help.cleared) keepAwake(true);
});

/* ══════════════════ ASKING FOR HELP ══════════════════
 *
 * SHE SAYS WHAT SHE NEEDS BEFORE THE DESK IS TOLD.
 *
 * The button used to raise the hand straight away and ask why afterwards. Two round trips
 * over salon wifi with a technician standing there, and the desk got "Chelsea needs help"
 * followed a couple of seconds later by what for — so the first thing anybody at the desk
 * did was wait. Trung, watching it happen: the delay is more apparent.
 *
 * The choosing now happens here, on the phone, where it costs nothing, and ONE call carries
 * the whole message.
 *
 * AND SHE CAN USE HER OWN WORDS. Four chips cannot cover a salon floor. "Her gel is lifting
 * on two nails and I am out of my base" is the message; "A question" is not. A chip on its
 * own still sends — the fastest path stays one tap — and so does text on its own.
 *
 * NOTHING IS REQUIRED. A hand up with no words is still a hand up. Somebody whose hands are
 * full must never be blocked from asking by a form.
 */
var HELP_CHIPS = ['Extra hands','Supplies','A question','The client needs something'];
var HELP_PICK = '';

function askHelp(){
  HELP_PICK = '';
  $('veil').className = 'veil on';
  $('veil').innerHTML = '<div class="alert"><h3>What do you need?</h3>'
    + '<p class="lede">Pick one, or write it. The front desk sees this the moment you send it.</p>'
    + '<div class="chips" id="helpchips">'
    + HELP_CHIPS.map(function(r){
        return '<button class="c pick" data-help="'+esc(r)+'">'+esc(r)+'</button>'; }).join('')
    + '</div>'
    + '<textarea class="in" id="helptext" rows="2" placeholder="Anything else they should know"'
    + ' maxlength="200" style="margin-top:10px"></textarea>'
    + '<button class="btn" id="helpgo" style="margin-top:12px">'+ICON.hand+'Ask for help</button>'
    + '<button class="skip" onclick="shutVeil()" style="margin-top:8px">Cancel</button></div>';

  Array.prototype.forEach.call($('veil').querySelectorAll('[data-help]'), function(b){
    b.onclick = function(){
      /* Tapping the chosen chip again clears it — she may have meant to type instead, and a
         choice that cannot be undone is a choice people avoid making. */
      var v = b.getAttribute('data-help');
      HELP_PICK = (HELP_PICK === v) ? '' : v;
      Array.prototype.forEach.call($('veil').querySelectorAll('[data-help]'), function(o){
        o.className = 'c pick' + (o.getAttribute('data-help') === HELP_PICK ? ' on' : '');
      });
    };
  });
  $('helpgo').onclick = function(){ sendHelp(this); };
}

function sendHelp(btn){
  var text = ($('helptext') && $('helptext').value) || '';
  var reason = HELP_PICK && text ? HELP_PICK + ' — ' + text : (HELP_PICK || text);
  keepAwake(true);
  /* THE RED BAR APPEARS ON THE PRESS, and its clock starts from the press. She raised her
     hand at that second, not when Google got round to writing the row — and a hand that
     seems to take a second to go up is a hand people stop raising. The bar is redrawn from
     the server on the next poll; if the request were refused it comes straight back down
     with the reason, which is the same rule every preview in this file follows. */
  var was = S.help;
  S.help = { helpId: 'pending', tech: S.tech, at: '', atMs: Date.now(), ack: null, reason: reason };
  shutVeil(); render();
  api('help', { token:S.token, reason:HELP_PICK, text:text }).then(function(r){
    if (r.existing) toast('You already have a request open.');
    pollHot();                       // the server's own version lands a moment later
  })['catch'](function(e){
    S.help = was; render();
    keepAwake(false); toast(e.message,'err');
  });
}

/* Adding or changing the reason on a request that is already open — the same sheet, so there
   is one place that knows how to ask this question. */
function helpWhy(){
  askHelp();
  var go = $('helpgo');
  if (go){ go.innerHTML = ICON.check + 'Tell them'; go.onclick = function(){ changeHelpWhy(this); }; }
}
function changeHelpWhy(btn){
  var text = ($('helptext') && $('helptext').value) || '';
  if (!HELP_PICK && !String(text).trim()){ toast('Pick one or write it first.','err'); return; }
  btn.disabled = true; btn.textContent = 'Sending…';
  api('helpReason', { token:S.token, reason:HELP_PICK, text:text }).then(function(){
    shutVeil(); refresh();
  })['catch'](function(e){
    btn.disabled = false; btn.innerHTML = ICON.check + 'Tell them'; toast(e.message,'err');
  });
}
function clearHelp(){
  api('helpClear',{token:S.token,how:'tech'}).then(function(){
    keepAwake(false); toast('Closed.'); refresh();
  })['catch'](function(e){ toast(e.message,'err'); });
}

/* ─────────────────────────── alerts ─────────────────────────── */
var FEED = [];
function unseen(){ return FEED.filter(function(e){ return !S.seen[e.id]; }); }
function evText(e){
  var p = e.payload||{}, nm = '<b>'+esc(visitName(e.rowKey))+'</b>';
  function ba(was,now){ return '<span class="ba">'+(was?'<span class="was">'+esc(was)+'</span><span class="arrow">→</span>':'')
    + '<b>'+esc(now)+'</b></span>'; }
  switch(e.type){
    case 'WALKIN_ADD': return 'Walk-in <b>'+esc(p.name)+'</b> added'+(p.at?' at '+esc(p.at):'');
    case 'SVC_CHANGE': return nm+' service '+ba(p.from?p.from+' · '+money(p.fromPrice):'', p.to+' · '+money(p.price));
    /* Before -> after, like every other change to what she pays. The server has always sent
       fromPrice and toPrice; this line printed the label and threw the numbers away, so the
       one update that silently raises a bill was the one that did not show it. */
    case 'ADDON':      return nm+' add-on <b>'+esc(p.label||p.name)+'</b>'
                       + (p.toPrice ? ' ' + ba(money(p.fromPrice), money(p.toPrice)) : '');
    /* Print the brief itself. "It is on her card" made her go and look, mid-service, for
       something that could have been in front of her. */
    case 'DESIGN_BRIEF': return nm+' wants <b>'+esc(p.text||'a design — see her card')+'</b>'
                       + (p.photos ? ' <span class="quiet">('+p.photos+' photo'
                          +(p.photos>1?'s':'')+' on her card)</span>' : '');
    case 'DESK_NOTE':  return nm+' — <b>'+esc(p.text||'a note from the front desk')+'</b>';
    /* The desk finishing something she asked for. The row carries ids, not words, so the
       words are looked up in the list the poll already handed us — the desk does not repeat
       them on the wire and the two sides cannot drift apart in how they name a signal. */
    case 'SIGNAL_ACK': var what = ackLabels(p.ids), by = '<b>'+esc(e.who||'The front desk')+'</b>';
                       /* The fallback drops the "for", or an unresolved id reads "did what
                          you asked for for Mai Tran". */
                       return what ? by+' did it — <b>'+what+'</b> for '+nm
                                   : by+' did what you asked — '+nm;
    default: return nm+' '+esc(e.type.toLowerCase().replace(/_/g,' '));
  }
}
/* Turn acknowledged signal ids back into the words she used, from the sent list on her own
   visits. Anything not found is dropped rather than printed as a number. */
function ackLabels(ids){
  var want = {}, out = [];
  (ids||[]).forEach(function(id){ want[id] = 1; });
  (S.visits||[]).forEach(function(v){
    (v.sent||[]).forEach(function(x){ if (want[x.id] && x.label) out.push(x.label); });
  });
  return out.map(esc).join(', ');
}
/* Events carry the hashed handle, not the raw key — so match on that. */
function visitName(rowKey){
  var v = S.visits.filter(function(x){ return x.rowKey === rowKey; })[0];
  return v ? v.name : 'Your chair';
}
/* Only what the DESK sent her. Her own signals coming back would alert her about herself.
 *
 * A "seen" receipt is deliberately NOT an alert. The desk presses "Got it" on a batch, often
 * several times an hour, and a pop-up each time is how an alert stops being read at all —
 * the one that matters then gets dismissed with the rest. Seen shows up quietly on her card,
 * against the item. Only DONE interrupts her, because only done ends the question. */
function mine(e){
  if (e.who === S.tech || e.type.indexOf('HELP') === 0) return false;
  if (e.type === 'SIGNAL_ACK') return ((e.payload||{}).state === 'done');
  return true;
}

function paintAlert(){
  /* #alertveil, never #veil. This used to reach for the same element the composer uses, and
     the very next poll — four seconds later — set its className back to closed. The
     must-know box vanished mid-sentence, which read as the app refusing to open it. */
  var el = $('alertveil'), pend = unseen();
  if (!pend.length){ el.className='veil'; S.shownIds=[]; return; }
  var wasOpen = el.classList.contains('on');
  var fresh = wasOpen ? pend.filter(function(e){ return S.shownIds.indexOf(e.id)<0; }).map(function(e){return e.id;}) : [];
  S.shownIds = pend.map(function(e){ return e.id; });
  el.className = 'veil on';
  el.innerHTML = '<div class="alert"><div class="hd"><img src="'+LOGO+'" alt="" class="hdmark">From the front desk · '
    + pend.length+(pend.length>1?' updates':' update')+'</div>'
    + pend.slice().reverse().map(function(e){
        return '<div class="item'+(fresh.indexOf(e.id)>=0?' fresh':'')+'">'+evText(e)
          + '<div class="who">'+esc(e.who||'')+'</div></div>'; }).join('')
    + (fresh.length?'<div class="newline">'+fresh.length+' arrived while you were reading — included above.</div>':'')
    + '<button class="btn" style="margin-top:12px" onclick="ackShown()">Got it'
    + (pend.length>1?' — all '+pend.length:'')+'</button></div>';
}
/* Acknowledges EXACTLY what was on screen. Anything that lands a heartbeat later stays
   pending and the card simply stays open with it. Nothing can be marked read unread. */
function ackShown(){
  S.shownIds.forEach(function(id){ S.seen[id] = true; });
  paintAlert(); refreshBell(); render();
}
function openBell(){
  var el=$('veil');
  el.className='veil on';
  el.innerHTML = '<div class="alert"><div class="hd"><img src="'+LOGO+'" alt="" class="hdmark">From the front desk</div>'
    + (FEED.length ? FEED.slice().reverse().slice(0,14).map(function(e){
        return '<div class="item">'+(S.seen[e.id]?'':'<b style="color:var(--gold)">NEW </b>')
          + evText(e)+'<div class="who">'+esc(e.who||'')+'</div></div>'; }).join('')
      : '<p class="lede">Nothing yet today.</p>')
    + '<div class="row2"><button class="skip" style="flex:1" onclick="shutVeil()">Close</button>'
    + (unseen().length?'<button class="btn" style="flex:1" onclick="ackAll()">Mark all seen</button>':'')
    + '</div></div>';
}
function shutVeil(){ var v=$('veil'); v.className='veil'; v.innerHTML=''; }

/* ══════════════ CLOSING AN OVERLAY, AND WHEN NOT TO ══════════════
 *
 * Until now every dialog on this phone could only be closed by finding and tapping its own
 * Cancel button. Tapping the dark area around it — which is what a phone user does without
 * thinking — did nothing at all, and the dialog just sat there.
 *
 * TWO THINGS IT MUST NOT DO.
 *
 * It must not close #alertveil. That is the desk talking to her, and the whole reason it is a
 * full-screen block is that she has to see it. An overlay she can dismiss with a stray thumb
 * is an overlay that gets dismissed unread, which is the failure this app exists to prevent.
 *
 * It must not throw away something she has typed. A half-written note is work; a stray tap on
 * the backdrop is not an instruction to bin it. So a dialog with anything typed into it stays
 * open and says which button actually discards. Cancel still does, deliberately and by name.
 */
function veilHasTyping(v){
  return Array.prototype.some.call(v.querySelectorAll('input,textarea'), function (i) {
    return String(i.value || '').trim() !== '';
  });
}
function tryShutVeil(){
  var v = $('veil');
  if (!v || v.className.indexOf('on') < 0) return false;
  if (veilHasTyping(v)){ toast('Tap Cancel if you want to throw that away.'); return true; }
  shutVeil();
  return true;
}
/* The tap has to land on the backdrop ITSELF. Anywhere inside the dialog bubbles up to here
   too, and closing on that would make every button in it also a Cancel. */
$('veil').addEventListener('click', function(e){ if (e.target === $('veil')) tryShutVeil(); });
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape' && e.key !== 'Esc') return;
  if (tryShutVeil()) e.preventDefault();
});
function ackAll(){ FEED.forEach(function(e){ S.seen[e.id]=true; }); shutVeil(); refreshBell(); render(); }
function refreshBell(){
  var el = document.querySelector('.bellcount'); if (!el) return;
  var n = unseen().length; el.textContent = n||''; el.style.display = n?'flex':'none';
}

/* ══════════════════ INSTANT, WHEN THERE IS A CHANNEL ══════════════════
 * Apps Script cannot push, and cannot be polled fast enough to feel live: a consumer account
 * has 90 MINUTES of script runtime a day and Rebook's sync already spends half of it. So the
 * server rings a doorbell on an outside channel and this page holds that connection open.
 * When it rings we call the book once — under a second, and a few hundred calls a day instead
 * of many thousands.
 *
 * EventSource, not a websocket library: built into every phone browser, reconnects by itself,
 * and adds no dependency to a page served from GitHub.
 *
 * With REALTIME empty everything still works on the slow poll below. The channel makes it
 * instant; it is never what makes it function.
 */
var REALTIME = '';                     // e.g. https://<project>.firebaseio.com/tick.json
var ES = null, ESFAIL = 0;

function listen(){
  if (!REALTIME || !window.EventSource || ES) return;
  try {
    ES = new EventSource(REALTIME + (REALTIME.indexOf('?') < 0 ? '?' : '&') + 'x=' + Date.now());
    ES.addEventListener('put',   function(){ ESFAIL = 0; refresh(true); });
    ES.addEventListener('patch', function(){ ESFAIL = 0; refresh(true); });
    ES.onerror = function(){
      /* Back off and never spin: a phone in a dead-wifi corner must not sit reopening a
         socket for an hour. The poll keeps working throughout. */
      try { ES.close(); } catch (e) {}
      ES = null; ESFAIL++;
      if (ESFAIL < 6) setTimeout(listen, Math.min(60000, 2000 * Math.pow(2, ESFAIL)));
    };
  } catch (e) { ES = null; }
}

/* ─────────────────────────── the poll ───────────────────────────
 * WHAT WE MEASURED, AND WHY THE INTERVAL MOVES.
 *
 * A call to Apps Script costs ~0.9 seconds of waiting no matter what it does — measured on
 * the live deployment, and it is the same 0.9s for a door that never opens the spreadsheet
 * and for one that reads the whole day. It is Google's dispatch, not our code, so no amount
 * of tuning on this side makes a single refresh feel instant.
 *
 * A CORRECTION worth writing down, because the first version of this comment got it wrong.
 * The "90 minutes of script runtime a day" limit is labelled "TRIGGERS total runtime" in
 * Google's quota table. Polling a web app does not spend it — Rebook's every-minute sync
 * trigger does. These intervals were originally stretched to protect a budget that was
 * never at risk.
 *
 * What actually sets the pace: the 0.9s floor above, "simultaneous executions per user: 30"
 * (six phones and a desk never approach it), and not hammering the spreadsheet.
 *
 * After anything arrives, poll every 4 seconds, backing off by half again per quiet poll to
 * 15. Fifteen is the real number: it is the longest she can go without hearing that her
 * client's service changed. Anything she taps snaps it back to fast, and a dark screen does
 * not poll at all — a phone face-down on the station is free.
 */
var POLLT = null, POLL_HOT = 4000, POLL_COLD = 15000, POLL_MS = POLL_HOT;
function pollHot(){ POLL_MS = POLL_HOT; poll(); }              // something happened: lean in
function pollCool(){ POLL_MS = Math.min(POLL_COLD, Math.round(POLL_MS * 1.5)); }
function pollMs(){ return ES ? 300000 : POLL_MS; }             // a live channel makes this a net
function poll(){
  clearTimeout(POLLT);
  var ms = pollMs();
  /* Jittered, so six phones that all opened at the morning meeting do not knock together. */
  POLLT = setTimeout(function(){ if (!document.hidden) refresh(true); poll(); },
                     ms + Math.round((Math.random() - 0.5) * ms * 0.3));
}
document.addEventListener('visibilitychange', function(){
  if (document.hidden) return;
  refresh(true);
  pollHot();                      // she just picked the phone up: she is about to do something
  listen();                       // a backgrounded phone usually has its socket cut
  checkBuild();                   // and it is the cheapest moment to find out she is out of date
});

/* ══════════════════════ KEEPING THIS PAGE UP TO DATE ══════════════════════
 *
 * MEASURED, 2026-08-15. A fix went live on the server at 05:49:59 and the page was published
 * at 05:50:31. A test run at 05:53:11 — nearly three minutes later — still showed the old
 * behaviour, and the report back was "it did not work".
 *
 * Two reasons, and neither is fixable at the server:
 *   1. GitHub Pages serves this file with `cache-control: max-age=600`. A phone that fetched
 *      it a minute before the deploy keeps that copy for ten more minutes and does not ask.
 *      Pages does not let us set that header.
 *   2. A tab left open never re-fetches anything. The old code stays in memory all day.
 *
 * So the page checks for itself. `build.txt` is a few bytes, published in the same commit as
 * this file, and read with `cache: 'no-store'` so it is never the cached one. When it names a
 * build we are not running, we reload — through a NEW URL (`?v=`), because reloading the same
 * URL is served the same stale copy and would change nothing.
 *
 * WHY IT WAITS. Reloading the instant an update appears would throw away a half-typed note or
 * cut a photo that is still uploading. So it waits for a moment when she has nothing open and
 * nothing in the air.
 *
 * WHY IT GIVES UP. If a reload does not land on the new build, reloading again produces an
 * endless loop on a phone somebody is trying to work from. Two tries, then it stops and says
 * plainly what to do.
 */
var BUILD = 'db824a9e3cb9';                  /* stamped by _stamp_build.py — never edit by hand */
var PENDING_BUILD = '', UPDT = null;

function buildTried(b){
  try { return sessionStorage.getItem('artonus_build_try') === b; } catch (e) { return false; }
}
function markBuildTried(b){
  try { sessionStorage.setItem('artonus_build_try', b); } catch (e) {}
}

function checkBuild(){
  if (PENDING_BUILD) return;                       // already know; waiting for a safe moment
  /* Absolute, not relative. A page opened at a deeper path — the enrolment links were once
     /e/<code> — would resolve a relative name to /e/build.txt, get a 404, and silently never
     update again. A check that fails quietly is worse than no check. */
  fetch('/build.txt?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(t){
      var b = String(t || '').trim().slice(0, 40);
      if (!b || b === BUILD) return;
      if (buildTried(b)){
        /* We already reloaded for this one and came back running the old code. Reloading
           again would just do it forever. Say it once, in words she can act on. */
        stuckOnOldBuild();
        return;
      }
      PENDING_BUILD = b;
      applyUpdateWhenSafe();
    })['catch'](function(){ /* offline is not out of date; try again next time */ });
}

function safeToReload(){
  if (INFLIGHT > 0) return false;                                  // a call is still in the air
  var v = $('veil'), av = $('alertveil');
  if (v && v.className.indexOf('on') >= 0) return false;           // a dialog is open
  if (av && av.className.indexOf('on') >= 0) return false;         // an alert is up, unread
  if (document.activeElement && /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName))
    return false;                                                  // she is typing
  return true;
}

function applyUpdateWhenSafe(){
  clearTimeout(UPDT);
  if (!PENDING_BUILD) return;
  if (!safeToReload()){ UPDT = setTimeout(applyUpdateWhenSafe, 3000); return; }
  markBuildTried(PENDING_BUILD);
  toast('Updating the app…', null, ICON.check);
  var b = PENDING_BUILD;
  /* replace(), not assign(): the old copy must not sit in her back history, or the back
     button walks her straight into the version we just replaced. */
  setTimeout(function(){ location.replace(location.pathname + '?v=' + encodeURIComponent(b)); }, 700);
}

function stuckOnOldBuild(){
  var el = $('stale');
  if (!el || el.className === 'stale on') return;
  el.className = 'stale on';
  el.textContent = 'This app is out of date and could not update itself. Close it completely and open it again.';
}

/* Three minutes. Frequent enough that a fix reaches a chair within one client, small enough
   that it is a handful of bytes an hour. The visibility hook above covers the phone that has
   been in a pocket, which is the common case. */
setInterval(checkBuild, 180000);

/**
 * What a techPoll answer means for the feed — in ONE place, because opening the app and
 * refreshing it both do this, and the day they disagree is the day an alert is shown twice
 * or not at all.
 */
/**
 * What a techPoll answer means for the feed. One place, because opening the app and
 * refreshing it both do this and the day they disagree is the day an alert is shown twice or
 * not at all.
 *
 * Returns TRUE when the day rolled over, meaning the caller must fetch again from zero.
 * Resetting the cursor here is not enough on its own: this response was already filtered
 * server-side against YESTERDAY's cursor, and `S.cursor = r.cursor` below would immediately
 * put the cursor back at today's newest id — so the morning's first events would be skipped
 * exactly as before. The reset only counts if a fresh request follows it.
 *
 * `quiet` is for opening the app. The day's history belongs in the bell, not in a full-screen
 * modal — a technician who reloads at two in the afternoon should not have to dismiss every
 * update since nine.
 */
function absorb(r, quiet){
  if (r && r.date && S.day && r.date !== S.day){
    S.cursor = 0; FEED.length = 0; S.seen = {}; S.shownIds = [];
    S.day = r.date;
    return true;                  // caller refetches; next time round S.day matches, so once only
  }
  if (r && r.date) S.day = r.date;

  /* Kept by id. The cursor normally prevents a repeat, but a retry, a doorbell ring and a
     poll can overlap, and the same event landing twice shows the same alert twice — which
     reads as two clients needing something when only one does. */
  var have = {};
  FEED.forEach(function(e){ have[e.id] = 1; });

  var fresh = (r && r.events ? r.events : []).filter(mine).filter(function(e){ return !have[e.id]; });
  fresh.forEach(function(e){
    FEED.push(e);
    if (quiet) S.seen[e.id] = true;     // already history when she opened the app
  });
  if (r && r.cursor) S.cursor = r.cursor;

  /* Hot only for things SOMEBODY ELSE did. Her own tap already refreshed the screen, and
     letting it hold the phone at 4 seconds spends the salon's budget on nothing. */
  var fromElsewhere = fresh.filter(function(e){ return e.who !== S.tech; });
  if (!quiet && fromElsewhere.length) pollHot(); else pollCool();
  return false;
}

/* A poll that fails must SAY so. A frozen day and a quiet day look identical, and a
   technician has no way to tell that the last twenty minutes of updates never arrived. */
var POLLFAIL = 0;
function pollTrouble(on){
  POLLFAIL = on ? POLLFAIL + 1 : 0;
  var el = $('offline');
  if (!el) return;
  el.style.display = POLLFAIL >= 3 ? 'block' : 'none';
}

/* ONE call, not two. This used to ask techToday and then dayFeed, which is two executions
   and two lots of that 0.9s — for one refresh. techPoll answers both. */
var REFRESHING = false;
function refresh(quiet){
  /* One at a time. Two overlapping polls both read the cursor before either writes it, so
     both fetch the same events and the second pushes duplicates. */
  if (!S.token || REFRESHING) return;
  REFRESHING = true;
  api('techPoll', { token:S.token, since:S.cursor }).then(function(r){
    REFRESHING = false;
    pollTrouble(false);
    S.pollAt = Date.now();
    S.visits = r.visits; S.help = r.help; S.caps = r.caps||S.caps;
    if (r.vocab && r.vocab.length) S.vocab = r.vocab;
    S.changes = r.changes || [];
    if (S.key) S.visit = S.visits.filter(function(v){ return v.key===S.key; })[0] || S.visit;
    if (absorb(r)) { refresh(quiet); return; }     // the day rolled: start it from zero
    render(); paintAlert(); refreshBell();
  })['catch'](function(e){
    REFRESHING = false;
    if (/not signed in/.test(e.message)){ dropToken(); S.token=''; S.view='enrol'; render(); return; }
    pollTrouble(true);
    if (!quiet) toast(e.message,'err');
  });
}

function render(){
  if (S.view==='enrol' || !S.token) return viewEnrol();
  if (S.view==='visit') return viewVisit();
  return viewToday();
}

/* The help timers tick without a round trip — the clock is local, the state is the ledger's. */
setInterval(function(){ if (S.token && S.help) render(); }, 1000);

(function boot(){
  /* A few seconds after the day is on screen, not before it. Her chair is the urgent thing;
     whether this page is the newest one is not, and a phone that opens straight into a
     reload feels broken even when it is working correctly. */
  setTimeout(checkBuild, 5000);
  var t = loadToken();
  if (!t){ S.view='enrol'; render(); return; }
  S.token = t; loadDay(); listen();
})();
</script>
</body>
</html>
